name: Apply CSV And Cache Settings Fix

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: csv-cache-fix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply verified fix patch
        shell: bash
        run: |
          set -euo pipefail
          cat .fix-patch/p*.b64 > /tmp/cache-csv-fix.b64
          base64 -d /tmp/cache-csv-fix.b64 > /tmp/cache-csv-fix.patch.gz
          echo '5fc9085d12efcef0e6a936715af3a28c38a8ad8b5eb0fca025e8cefb714289e5  /tmp/cache-csv-fix.patch.gz' | sha256sum -c -
          gzip -dc /tmp/cache-csv-fix.patch.gz > /tmp/cache-csv-fix.patch
          echo '8c21d466fab66fc6296490adf967758dd2287603d80de02173ab19e68d672abc  /tmp/cache-csv-fix.patch' | sha256sum -c -
          patch -p1 < /tmp/cache-csv-fix.patch
          printf '%s\n' 'export current public source' > .source-export-trigger
          rm -rf .fix-patch .fix-overlay

      - name: Verify source and CSV mapping
        run: |
          python3 scripts/check_public_repo.py
          python3 scripts/check_feature_requirements.py
          python3 scripts/check_csv_mapping.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          mkdir -p build
          sdkmanager 'platforms;android-35' 'build-tools;37.0.0' 2>&1 | tee build/sdkmanager.log

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build four APKs
        run: |
          if [ -f scripts/run_with_no_output_watchdog.py ]; then
            python3 scripts/run_with_no_output_watchdog.py --silence-seconds 300 --log build/assemble-debug.log -- gradle --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug 2>&1 | tee build/assemble-debug.log
          fi

      - name: Show build failure details
        if: failure()
        run: |
          echo '===== assemble-debug.log tail ====='
          tail -n 260 build/assemble-debug.log || true

      - name: Verify APK package names and signatures
        shell: bash
        run: |
          set -euo pipefail
          aapt="$ANDROID_HOME/build-tools/37.0.0/aapt"
          apksigner="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          declare -A expected=(
            [babywifeclassic]='com.jianglab.babywife'
            [lidacaizhu]='com.jianglab.babywife.lidacaizhu'
            [jianglab]='com.jianglab.babywife.jianglab'
            [niubi]='com.jianglab.babywife.niubi'
          )
          mkdir -p verified-apks
          for flavor in babywifeclassic lidacaizhu jianglab niubi; do
            apk="app/build/outputs/apk/${flavor}/debug/app-${flavor}-debug.apk"
            test -s "$apk"
            package_name=$("$aapt" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            test "$package_name" = "${expected[$flavor]}"
            "$apksigner" verify --verbose "$apk"
            cp "$apk" "verified-apks/${flavor}.apk"
          done
          sha256sum verified-apks/*.apk | tee verified-apks/SHA256.txt

      - name: Commit applied source to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix CSV import and cache storage controls'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

      - name: Upload APKs and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-brand-csv-cache-fix-debug-apks
          path: |
            verified-apks/
            build/sdkmanager.log
            build/assemble-debug.log
          if-no-files-found: warn
          retention-days: 14
