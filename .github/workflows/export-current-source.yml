name: Export Current Public Source

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/export-current-source.yml
      - .source-export-trigger

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Package current source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path('.')
          out = Path('free-music-current-source.zip')
          excluded_parts = {'.git', '.gradle', 'build'}
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as z:
              for path in sorted(root.rglob('*')):
                  if not path.is_file() or path == out:
                      continue
                  if any(part in excluded_parts for part in path.parts):
                      continue
                  z.write(path, path.as_posix())
          print(out, out.stat().st_size)
          PY
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: free-music-current-source
          path: free-music-current-source.zip
          if-no-files-found: error
          retention-days: 1
