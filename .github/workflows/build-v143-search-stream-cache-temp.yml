name: Build v143 search stream and cache

on:
  push:
    branches:
      - agent/v128-m4a-decrypt
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v128-m4a-decrypt
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Apply v143 patch when needed
        run: |
          if grep -q 'versionCode 2026080143' app/build.gradle; then
            echo 'v143 source already present'
          else
            python scripts/apply_v143_search_stream_and_cache_patch.py
          fi
      - name: Verify all feature requirements
        run: python scripts/check_feature_requirements.py
      - name: Assert search stream and cache split
        run: |
          python - <<'PY'
          from pathlib import Path
          main = Path('app/src/main/java/com/jianglab/babywife/MainActivity.java').read_text(encoding='utf-8')
          quick = Path('app/src/main/java/com/jianglab/babywife/SearchQuickPlayback.java').read_text(encoding='utf-8')
          catalog = Path('app/src/main/java/com/jianglab/babywife/CatalogSearch.java').read_text(encoding='utf-8')
          cache = Path('app/src/main/java/com/jianglab/babywife/CacheStorage.java').read_text(encoding='utf-8')
          resolver = Path('app/src/main/java/com/jianglab/babywife/PlayableAudioResolver.java').read_text(encoding='utf-8')
          assert 'playSearchSongFast(song, playToken);' in main
          assert '已使用歌单中的同名歌曲缓存' in main
          assert 'startLocalPlayback(song, playToken, () -> {' in main
          assert 'cacheSearchPlaybackAsync(song, resolved, playToken);' in main
          assert main.index('startLocalPlayback(song, playToken, () -> {') < main.index('cacheSearchPlaybackAsync(song, resolved, playToken);')
          assert 'stage == 1 ? "kuwo"' in quick
          assert 'stage == 2 ? "netease"' in quick
          assert 'formatPriority' not in quick
          assert 'CacheStorage.storeAudio(context, key, extension, source' in quick
          assert 'String base = record.title + " - " + record.artist;' in cache
          assert 'findBestExactOnSource' in catalog
          assert 'NetworkMediaCache.cache(' in main[main.index('private void cacheCurrentPlaylistOneClick'):]
          assert 'AudioPlaybackVerifier.probeFile' in resolver
          print('v143 search stream/background cache assertions passed')
          PY
      - name: Build four release APKs
        run: |
          gradle --no-daemon \
            :app:assembleBabywifeclassicRelease \
            :app:assembleJianglabRelease \
            :app:assembleLidacaizhuRelease \
            :app:assembleNiubiRelease
      - uses: actions/upload-artifact@v4
        with:
          name: v143-four-unsigned-release-apks
          path: app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error
      - name: Commit formal source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle \
            app/src/main/java/com/jianglab/babywife/MainActivity.java \
            app/src/main/java/com/jianglab/babywife/CatalogSearch.java \
            app/src/main/java/com/jianglab/babywife/SearchQuickPlayback.java \
            scripts/check_feature_requirements.py PROJECT_LOG.md docs/CHANGELOG.md
          if git diff --cached --quiet; then
            echo 'No formal source changes to commit'
          else
            git commit -m 'Stream search results before background caching [skip ci]'
            git fetch origin agent/v128-m4a-decrypt
            git rebase origin/agent/v128-m4a-decrypt
            git push origin HEAD:agent/v128-m4a-decrypt
          fi
