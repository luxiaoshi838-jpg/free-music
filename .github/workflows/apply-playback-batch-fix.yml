name: Build v126 cache I/O guard APKs

on:
  push:
    branches:
      - tools/fix-pr9-playback-batch-cache
    paths:
      - .github/workflows/apply-playback-batch-fix.yml

permissions:
  contents: write

concurrency:
  group: build-v126-cache-io-guard
  cancel-in-progress: true

jobs:
  build-v126:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified public main commit
        uses: actions/checkout@v4
        with:
          ref: 921a3dbc32a3513d521eb7f5f7f968f0739df69c
          path: repo
          fetch-depth: 0

      - name: Checkout tools branch
        uses: actions/checkout@v4
        with:
          ref: tools/fix-pr9-playback-batch-cache
          path: tools-repo
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;37.0.0'

      - name: Verify v126 source before build
        id: source_checks
        working-directory: repo
        run: |
          python scripts/check_public_repo.py
          python scripts/check_feature_requirements.py
          grep -q 'versionCode 2026080126' app/build.gradle
          grep -q '2026.08.02.cache-io-guard-ui-feedback' app/build.gradle
          grep -q 'private void refreshCachedUrisAfterMigrationAsync()' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q '"cache-uri-refresh"' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'attachSubtlePressFeedback(previous);' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'attachSubtlePressFeedback(next);' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'clearSearchButton.setText("×")' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'clearSearchButton.setVisibility(View.GONE)' app/src/main/java/com/jianglab/babywife/MainActivity.java

      - name: Build all four debug brands
        id: build_apks
        working-directory: repo
        run: |
          chmod +x gradlew
          sed -i 's/^networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          attempt=1
          until ./gradlew --no-daemon :app:assembleDebug; do
            if [ "$attempt" -ge 3 ]; then
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 5
          done

      - name: Verify four APK outputs
        id: verify_apks
        working-directory: repo
        run: |
          find app/build/outputs/apk -type f -name '*.apk' -print
          test "$(find app/build/outputs/apk -type f -name '*.apk' | wc -l)" -ge 4

      - name: Upload v126 debug APKs
        id: upload_apks
        uses: actions/upload-artifact@v4
        with:
          name: cache-io-guard-ui-feedback-v126-apks-${{ github.run_id }}
          path: repo/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error

      - name: Record v126 build results
        if: always()
        working-directory: tools-repo
        env:
          CHECK_OUTCOME: ${{ steps.source_checks.outcome }}
          BUILD_OUTCOME: ${{ steps.build_apks.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_apks.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_apks.outcome }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p tools
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "artifact_name=cache-io-guard-ui-feedback-v126-apks-${GITHUB_RUN_ID}"
            echo "source_commit=921a3dbc32a3513d521eb7f5f7f968f0739df69c"
            echo "checks=${CHECK_OUTCOME}"
            echo "build=${BUILD_OUTCOME}"
            echo "verify=${VERIFY_OUTCOME}"
            echo "upload=${UPLOAD_OUTCOME}"
          } > tools/latest_v126_build.txt
          git add tools/latest_v126_build.txt
          git commit -m "Record v126 APK build ${GITHUB_RUN_ID}" || true
          git pull --rebase origin tools/fix-pr9-playback-batch-cache || true
          git push origin HEAD:tools/fix-pr9-playback-batch-cache
