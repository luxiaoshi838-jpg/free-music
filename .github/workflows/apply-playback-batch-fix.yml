name: Apply startup ANR and UI feedback fix

on:
  push:
    branches:
      - tools/fix-pr9-playback-batch-cache
    paths:
      - tools/apply_startup_anr_ui_feedback_fix.py
      - tools/apply_ui_responsiveness_notification_fix.py
      - tools/startup_anr_ui_payload/**
      - .github/workflows/apply-playback-batch-fix.yml

permissions:
  contents: write

concurrency:
  group: startup-anr-ui-feedback
  cancel-in-progress: true

jobs:
  apply-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/multiformat-cache-priority-60s
          path: repo
          fetch-depth: 0

      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: tools/fix-pr9-playback-batch-cache
          path: patch
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;37.0.0'

      - name: Apply startup ANR and UI feedback fix
        id: patch_sources
        shell: bash
        run: |
          set +e
          python patch/tools/apply_ui_responsiveness_notification_fix.py --root repo > patch/tools/latest_startup_anr_ui_patch.log 2>&1
          status=$?
          tail -n 120 patch/tools/latest_startup_anr_ui_patch.log
          exit "$status"

      - name: Run public-repo and feature checks
        id: feature_checks
        working-directory: repo
        run: |
          python scripts/check_public_repo.py
          python scripts/check_feature_requirements.py
          git diff --check

      - name: Build all four debug brands
        id: build_apks
        working-directory: repo
        run: |
          chmod +x gradlew
          sed -i 's/^networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          attempt=1
          until ./gradlew --no-daemon :app:assembleDebug; do
            if [ "$attempt" -ge 3 ]; then
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 5
          done

      - name: Verify four APK outputs and current fix
        id: verify_apks
        working-directory: repo
        run: |
          find app/build/outputs/apk -type f -name '*.apk' -print
          test "$(find app/build/outputs/apk -type f -name '*.apk' | wc -l)" -ge 4
          grep -q 'versionCode 2026080125' app/build.gradle
          grep -q 'startup-anr-ui-feedback' app/build.gradle
          grep -q 'CacheUriRefreshWorker' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'cacheUriRefreshSerial' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'searchClearButton' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'animateNavigationPress' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q '.scaleX(0.94f)' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'StartupPlaylistLoader' app/src/main/java/com/jianglab/babywife/MainActivity.java
          ! grep -q 'PlaybackControlService.ensureStarted(this);' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'A real device may temporarily reject foreground-service starts.' app/src/main/java/com/jianglab/babywife/PlaybackControlService.java
          grep -q 'private void cacheAndPlay(Song song, int playToken)' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'static CacheResult cache(Context context, String catalogJson, boolean persist' app/src/main/java/com/jianglab/babywife/NetworkMediaCache.java

      - name: Push feature branch
        id: push_feature
        working-directory: repo
        run: |
          git checkout -- gradle/wrapper/gradle-wrapper.properties gradlew
          git push origin HEAD:fix/multiformat-cache-priority-60s

      - name: Upload four debug APKs
        id: upload_apks
        uses: actions/upload-artifact@v4
        with:
          name: startup-anr-ui-feedback-apks-${{ github.run_id }}
          path: repo/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error

      - name: Record run results
        if: always()
        working-directory: patch
        env:
          PATCH_OUTCOME: ${{ steps.patch_sources.outcome }}
          CHECK_OUTCOME: ${{ steps.feature_checks.outcome }}
          BUILD_OUTCOME: ${{ steps.build_apks.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_apks.outcome }}
          PUSH_OUTCOME: ${{ steps.push_feature.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_apks.outcome }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p tools
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "artifact_name=startup-anr-ui-feedback-apks-${GITHUB_RUN_ID}"
            echo "feature_commit=$(git -C ../repo rev-parse HEAD 2>/dev/null || true)"
            echo "patch=${PATCH_OUTCOME}"
            echo "checks=${CHECK_OUTCOME}"
            echo "build=${BUILD_OUTCOME}"
            echo "verify=${VERIFY_OUTCOME}"
            echo "push=${PUSH_OUTCOME}"
            echo "upload=${UPLOAD_OUTCOME}"
          } > tools/latest_startup_anr_ui_run.txt
          touch tools/latest_startup_anr_ui_patch.log
          git add tools/latest_startup_anr_ui_run.txt tools/latest_startup_anr_ui_patch.log
          git commit -m "Record startup ANR UI build ${GITHUB_RUN_ID}" || true
          git pull --rebase origin tools/fix-pr9-playback-batch-cache || true
          git push origin HEAD:tools/fix-pr9-playback-batch-cache
