name: Apply isolated resumable playlist cache

on:
  push:
    branches:
      - tools/fix-pr9-playback-batch-cache
    paths:
      - tools/replace_batch_cache_service_v2.py
      - tools/apply_batch_cache_state_machine_v2.py
      - .github/workflows/apply-playback-batch-fix.yml

permissions:
  contents: write

concurrency:
  group: isolated-resumable-playlist-cache
  cancel-in-progress: true

jobs:
  apply-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/multiformat-cache-priority-60s
          path: repo
          fetch-depth: 0

      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: tools/fix-pr9-playback-batch-cache
          path: patch
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;37.0.0'

      - name: Apply isolated cache state machine
        id: patch_sources
        run: |
          python patch/tools/replace_batch_cache_service_v2.py --root repo
          python patch/tools/apply_batch_cache_state_machine_v2.py --root repo

      - name: Run public-repo and feature checks
        id: feature_checks
        working-directory: repo
        run: |
          python scripts/check_public_repo.py
          python scripts/check_feature_requirements.py
          git diff --check

      - name: Build all four debug brands
        id: build_apks
        working-directory: repo
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Verify four APK outputs
        id: verify_apks
        working-directory: repo
        run: |
          find app/build/outputs/apk -type f -name '*.apk' -print
          test "$(find app/build/outputs/apk -type f -name '*.apk' | wc -l)" -ge 4

      - name: Commit and push feature branch
        id: push_feature
        working-directory: repo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle \
            app/src/main/AndroidManifest.xml \
            app/src/main/java/com/jianglab/babywife/MainActivity.java \
            app/src/main/java/com/jianglab/babywife/NetworkMediaCache.java \
            app/src/main/java/com/jianglab/babywife/PlaylistBatchCacheService.java \
            app/src/main/java/com/jianglab/babywife/CacheKeyLock.java \
            scripts/check_feature_requirements.py \
            PROJECT_LOG.md docs/CHANGELOG.md
          git diff --cached --check
          git commit -m 'Isolate, pause and restart playlist batch caching'
          git push origin HEAD:fix/multiformat-cache-priority-60s

      - name: Upload four debug APKs
        id: upload_apks
        uses: actions/upload-artifact@v4
        with:
          name: isolated-resumable-cache-apks-${{ github.run_id }}
          path: repo/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error

      - name: Record run results
        if: always()
        working-directory: patch
        env:
          PATCH_OUTCOME: ${{ steps.patch_sources.outcome }}
          CHECK_OUTCOME: ${{ steps.feature_checks.outcome }}
          BUILD_OUTCOME: ${{ steps.build_apks.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_apks.outcome }}
          PUSH_OUTCOME: ${{ steps.push_feature.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_apks.outcome }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p tools
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "artifact_name=isolated-resumable-cache-apks-${GITHUB_RUN_ID}"
            echo "feature_commit=$(git -C ../repo rev-parse HEAD 2>/dev/null || true)"
            echo "patch=${PATCH_OUTCOME}"
            echo "checks=${CHECK_OUTCOME}"
            echo "build=${BUILD_OUTCOME}"
            echo "verify=${VERIFY_OUTCOME}"
            echo "push=${PUSH_OUTCOME}"
            echo "upload=${UPLOAD_OUTCOME}"
          } > tools/latest_isolated_resumable_cache_run.txt
          git add tools/latest_isolated_resumable_cache_run.txt
          git commit -m "Record isolated resumable cache build ${GITHUB_RUN_ID}" || true
          git push origin HEAD:tools/fix-pr9-playback-batch-cache
