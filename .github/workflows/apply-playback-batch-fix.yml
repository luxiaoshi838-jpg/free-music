name: Validate real decoder compatibility build

on:
  push:
    branches:
      - tools/fix-pr9-playback-batch-cache
    paths:
      - .github/workflows/apply-playback-batch-fix.yml
      - tools/real-decoder-validation-trigger.txt

permissions:
  contents: write

concurrency:
  group: real-decoder-validation
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/multiformat-cache-priority-60s
          path: repo
          fetch-depth: 0

      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          ref: tools/fix-pr9-playback-batch-cache
          path: validation
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;37.0.0'

      - name: Run feature checks
        id: feature_checks
        working-directory: repo
        run: python scripts/check_feature_requirements.py

      - name: Build all four debug brands
        id: build_apks
        working-directory: repo
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Verify four APK outputs
        id: verify_apks
        working-directory: repo
        run: |
          find app/build/outputs/apk -type f -name '*.apk' -print
          test "$(find app/build/outputs/apk -type f -name '*.apk' | wc -l)" -ge 4

      - name: Upload four debug APKs
        id: upload_apks
        uses: actions/upload-artifact@v4
        with:
          name: real-decoder-validation-debug-apks-${{ github.run_id }}
          path: repo/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error

      - name: Record run results
        if: always()
        working-directory: validation
        env:
          CHECK_OUTCOME: ${{ steps.feature_checks.outcome }}
          BUILD_OUTCOME: ${{ steps.build_apks.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_apks.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_apks.outcome }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p tools
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "artifact_name=real-decoder-validation-debug-apks-${GITHUB_RUN_ID}"
            echo "feature_commit=$(git -C ../repo rev-parse HEAD 2>/dev/null || true)"
            echo "checks=${CHECK_OUTCOME}"
            echo "build=${BUILD_OUTCOME}"
            echo "verify=${VERIFY_OUTCOME}"
            echo "upload=${UPLOAD_OUTCOME}"
          } > tools/latest_real_decoder_run.txt
          git add tools/latest_real_decoder_run.txt
          git commit -m "Record real decoder build ${GITHUB_RUN_ID}" || true
          git push origin HEAD:tools/fix-pr9-playback-batch-cache
