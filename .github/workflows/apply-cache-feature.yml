name: Apply Cache Feature And Build APKs

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cache-feature-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply verified feature overlay
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G '.feature-overlay/part*.b64' >/dev/null; then
            cat .feature-overlay/part*.b64 > /tmp/feature-overlay.b64
            base64 -d /tmp/feature-overlay.b64 > /tmp/feature-overlay.tar.gz
            echo 'f22be945eb21b617dfcac8739a49d460d9cb67dc91d11dd29d61c45c01f61876  /tmp/feature-overlay.tar.gz' | sha256sum -c -
            tar -xzf /tmp/feature-overlay.tar.gz -C .
            rm -rf .feature-overlay
            echo 'OVERLAY_APPLIED=true' >> "$GITHUB_ENV"
          else
            echo 'OVERLAY_APPLIED=false' >> "$GITHUB_ENV"
          fi

      - name: Verify public source and feature requirements
        run: |
          python3 scripts/check_public_repo.py
          python3 scripts/check_feature_requirements.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          mkdir -p build
          sdkmanager 'platforms;android-35' 'build-tools;37.0.0' 2>&1 | tee build/sdkmanager.log

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build four APKs with five-minute watchdog
        run: |
          if [ -f scripts/run_with_no_output_watchdog.py ]; then
            python3 scripts/run_with_no_output_watchdog.py --silence-seconds 300 --log build/assemble-debug.log -- gradle --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug 2>&1 | tee build/assemble-debug.log
          fi

      - name: Verify APK package names and signatures
        shell: bash
        run: |
          set -euo pipefail
          aapt="$ANDROID_HOME/build-tools/37.0.0/aapt"
          apksigner="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          declare -A expected=(
            [babywifeclassic]='com.jianglab.babywife'
            [lidacaizhu]='com.jianglab.babywife.lidacaizhu'
            [jianglab]='com.jianglab.babywife.jianglab'
            [niubi]='com.jianglab.babywife.niubi'
          )
          mkdir -p verified-apks
          for flavor in babywifeclassic lidacaizhu jianglab niubi; do
            apk="app/build/outputs/apk/${flavor}/debug/app-${flavor}-debug.apk"
            test -s "$apk"
            package_name=$("$aapt" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            test "$package_name" = "${expected[$flavor]}"
            "$apksigner" verify --verbose "$apk"
            cp "$apk" "verified-apks/${flavor}.apk"
          done
          sha256sum verified-apks/*.apk | tee verified-apks/SHA256.txt

      - name: Commit applied source to feature branch
        if: env.OVERLAY_APPLIED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement cache storage, replacement and JiangLab verification'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

      - name: Upload APKs and build logs
        uses: actions/upload-artifact@v4
        with:
          name: four-brand-cache-fix-debug-apks
          path: |
            verified-apks/
            build/sdkmanager.log
            build/assemble-debug.log
          if-no-files-found: error
          retention-days: 14
