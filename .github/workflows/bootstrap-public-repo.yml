name: Public Repository Finalization Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-finalized-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Confirm repository is finalized
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/java/com/jianglab/babywife/MainActivity.java
          test ! -d .bootstrap
          python3 scripts/check_public_repo.py
          echo "Public repository is already finalized."
