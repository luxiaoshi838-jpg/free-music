name: Apply v126 sync payload

on:
  push:
    branches:
      - agent/v126-cache-io-ui-feedback
    paths:
      - .sync/v126_manifest.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and verify source payload
        shell: bash
        run: |
          set -euo pipefail
          cat .sync/v126_payload.part* > /tmp/v126_payload.b64
          base64 --decode /tmp/v126_payload.b64 > /tmp/v126_payload.tar.gz
          expected="$(awk 'NR==1 {print $1}' .sync/v126_manifest.txt)"
          actual="$(sha256sum /tmp/v126_payload.tar.gz | awk '{print $1}')"
          test "$actual" = "$expected"
          tar -xzf /tmp/v126_payload.tar.gz -C .

      - name: Validate synchronized source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode 2026080126' app/build.gradle
          grep -q 'versionName "2026.08.02.cache-io-guard-ui-feedback"' app/build.gradle
          grep -q 'private void refreshCachedUrisAfterMigrationAsync()' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q '"cache-uri-refresh"' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'attachSubtlePressFeedback(previous);' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'attachSubtlePressFeedback(next);' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'TextView clearSearchButton = new TextView(this);' app/src/main/java/com/jianglab/babywife/MainActivity.java
          python -m py_compile scripts/check_feature_requirements.py

      - name: Commit restored source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .sync .github/workflows/apply-v126-sync.yml
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync v126 cache I/O and UI feedback"
          git push
