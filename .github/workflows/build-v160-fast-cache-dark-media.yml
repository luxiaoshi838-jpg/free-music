name: Build v160 Fast Cache Dark Media

on:
  push:
    branches:
      - agent/v160-fast-cache-dark-media
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-or-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout v160 branch
        uses: actions/checkout@v4
        with:
          ref: agent/v160-fast-cache-dark-media
          fetch-depth: 0

      - name: Apply v160 patch and persist source
        id: patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/apply_v160_fast_cache_dark_media.py
          if git diff --quiet; then
            echo "patched=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              app/build.gradle \
              app/src/main/java/com/jianglab/babywife/MainActivity.java \
              app/src/main/java/com/jianglab/babywife/PlaybackControlService.java \
              app/src/main/java/com/jianglab/babywife/PlaybackArtworkLoader.java \
              PROJECT_LOG.md
            git commit -m "v160: speed playlist cache status and darken media card"
            git push origin HEAD:agent/v160-fast-cache-dark-media
            echo "patched=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop first pass after source commit
        if: steps.patch.outputs.patched == 'true'
        run: |
          echo "Source committed. The push-triggered second run will build the persisted v160 source."

      - name: Verify v160 source
        if: steps.patch.outputs.patched != 'true'
        run: |
          set -euo pipefail
          grep -q 'versionCode 2026080760' app/build.gradle
          grep -q 'versionName "2026.08.07.v160-fast-cache-dark-media"' app/build.gradle
          ! grep -q '正在检查缓存状态' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'if (songHasRecordedCache(song)) continue;' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'Media3PlaybackCacheIndex.friendlyUri(this, media3Key)' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'FALLBACK_MEDIA_COLOR' app/src/main/java/com/jianglab/babywife/PlaybackControlService.java
          grep -q 'setColorized(true)' app/src/main/java/com/jianglab/babywife/PlaybackControlService.java
          grep -q 'TARGET_SIZE = 1280' app/src/main/java/com/jianglab/babywife/PlaybackArtworkLoader.java
          ! grep -Eqi 'favorite|heart' app/src/main/java/com/jianglab/babywife/PlaybackControlService.java
          test "$(grep -c 'addAction(previous)' app/src/main/java/com/jianglab/babywife/PlaybackControlService.java)" -eq 1
          test "$(grep -c 'addAction(toggle)' app/src/main/java/com/jianglab/babywife/PlaybackControlService.java)" -eq 1
          test "$(grep -c 'addAction(next)' app/src/main/java/com/jianglab/babywife/PlaybackControlService.java)" -eq 1

      - name: Prepare Android toolchain
        if: steps.patch.outputs.patched != 'true'
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64}"
          export PATH="$JAVA_HOME/bin:$PATH"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;37.0.0"
          curl -fL --retry 5 --retry-delay 5 https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle-8.7-bin.zip
          rm -rf /tmp/gradle-8.7
          unzip -q /tmp/gradle-8.7-bin.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle --version

      - name: Build four unsigned v160 release APKs
        if: steps.patch.outputs.patched != 'true'
        env:
          JIANG_LAB_PASSPHRASE_SHA256: ${{ secrets.JIANG_LAB_PASSPHRASE_SHA256 }}
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64}"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$JAVA_HOME/bin:/tmp/gradle-8.7/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p build
          /tmp/gradle-8.7/bin/gradle --no-daemon assembleRelease 2>&1 | tee build/assemble-v160-release.log

      - name: Align and verify package identities
        if: steps.patch.outputs.patched != 'true'
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          aapt="$ANDROID_HOME/build-tools/37.0.0/aapt"
          zipalign="$ANDROID_HOME/build-tools/37.0.0/zipalign"
          mkdir -p v160-unsigned-aligned signing-tools/lib
          declare -A expected=(
            [babywifeclassic]="com.jianglab.babywife"
            [lidacaizhu]="com.jianglab.babywife.lidacaizhu"
            [jianglab]="com.jianglab.babywife.jianglab"
            [niubi]="com.jianglab.babywife.niubi"
          )
          for flavor in babywifeclassic lidacaizhu jianglab niubi; do
            input="app/build/outputs/apk/${flavor}/release/app-${flavor}-release-unsigned.apk"
            test -s "$input"
            output="v160-unsigned-aligned/${flavor}_v160_unsigned_aligned.apk"
            "$zipalign" -f -p 4 "$input" "$output"
            "$zipalign" -c -p 4 "$output"
            badging=$("$aapt" dump badging "$output")
            package_name=$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            version_code=$(printf '%s\n' "$badging" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")
            test "$package_name" = "${expected[$flavor]}"
            test "$version_code" = "2026080760"
          done
          cp "$ANDROID_HOME/build-tools/37.0.0/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/37.0.0/zipalign" signing-tools/
          cp "$ANDROID_HOME/build-tools/37.0.0/lib/apksigner.jar" signing-tools/lib/
          chmod +x signing-tools/apksigner signing-tools/zipalign
          sha256sum v160-unsigned-aligned/*.apk | tee v160-unsigned-aligned/SHA256.txt
          git rev-parse HEAD | tee v160-unsigned-aligned/SOURCE_HEAD.txt
          git diff 8a6314ff0570ce68a29a4e5f542b948bfa2b07b2..HEAD -- \
            app/build.gradle \
            app/src/main/java/com/jianglab/babywife/MainActivity.java \
            app/src/main/java/com/jianglab/babywife/PlaybackControlService.java \
            app/src/main/java/com/jianglab/babywife/PlaybackArtworkLoader.java \
            > v160-unsigned-aligned/v159_to_v160.patch

      - name: Upload unsigned APKs and local signing tools
        if: steps.patch.outputs.patched != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: v160-unsigned-aligned-and-signing-tools
          path: |
            v160-unsigned-aligned/
            signing-tools/
            build/assemble-v160-release.log
          if-no-files-found: error
          retention-days: 7
