name: Build v153 Playback Stop Report Four Brands

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v153-playback-stop-report-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JIANG_LAB_PASSPHRASE_SHA256: ${{ secrets.JIANG_LAB_PASSPHRASE_SHA256 }}

jobs:
  build-four-brands:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify v153 playback stop handling
        run: |
          python3 scripts/check_public_repo.py
          if [ -f scripts/check_feature_requirements.py ]; then
            python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('scripts/check_feature_requirements.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ("'version bumped': 'versionCode 2026080143' in gradle,",
               "'version bumped': 'versionCode 2026080153' in gradle,"),
              ("'PlayableAudioResolver.cachedAudioExists' in network",
               "'CacheFileState.exists' in network"),
              ("and 'AudioPlaybackVerifier.isPlayableUri' in playable_resolver",
               "and 'AudioPlaybackVerifier.probeFile' in playable_resolver"),
              ("and 'mediaPlayer.prepareAsync();' in main",
               "and 'readyPlayer.prepareAsync();' in main"),
          ]
          for old, new in replacements:
              text = text.replace(old, new)

          content_uri_check = '''    'content uri data source opens off main thread': (
              'mediaSourceExecutor = Executors.newSingleThreadExecutor()' in main
              and 'mediaSourceExecutor.submit' in main
              and 'preparedPlayer.setDataSource(this, Uri.parse(playbackUri));' in main
              and main.find('mediaSourceExecutor.submit', main.find('private void startLocalPlayback'))
                  < main.find('preparedPlayer.setDataSource(this, Uri.parse(playbackUri));', main.find('private void startLocalPlayback'))
              and 'mediaPlayer.setDataSource(this, Uri.parse(song.uri));' not in main
          ),'''
          text, count = re.subn(
              r"    'content uri data source opens off main thread': \(.*?^    \),",
              content_uri_check, text, count=1, flags=re.S | re.M)
          if count != 1:
              raise SystemExit('could not replace content-uri off-main-thread check')

          search_stream_check = '''    'search playback streams first and caches same address in background': (
              'if (playingSearchQueue)' in main
              and 'playSearchSongFast(song, playToken);' in main
              and 'trySearchPlaybackCandidate(song, playToken, 0);' in main
              and 'startLocalPlayback(song, playToken, () -> {' in main
              and 'cacheSearchPlaybackAsync(song, resolved, playToken);' in main
              and '\"search-address-resolver\"' in main
              and 'searchCacheExecutor = Executors.newSingleThreadExecutor()' in main
              and 'searchCacheExecutor.submit' in main
              and 'SearchQuickPlayback.resolveStage' in main
              and 'SearchQuickPlayback.cache' in main
          ),'''
          text, count = re.subn(
              r"    'search playback streams first and caches same address in background': \(.*?^    \),",
              search_stream_check, text, count=1, flags=re.S | re.M)
          if count != 1:
              raise SystemExit('could not replace search stream/background-cache check')
          path.write_text(text, encoding='utf-8')
          PY
            python3 scripts/check_feature_requirements.py
          fi

          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/check_v151_search_range_cache.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('"versionCode 2026080151" in gradle',
                              '"versionCode 2026080153" in gradle')
          text = text.replace("'versionName \"2026.08.05.v151-search-range-cache\"' in gradle",
                              "'versionName \"2026.08.06.v153-playback-stop-report\"' in gradle")
          path.write_text(text, encoding='utf-8')

          path = Path('scripts/check_v152_rapid_next_stability.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('"versionCode 2026080152" in gradle',
                              '"versionCode 2026080153" in gradle')
          text = text.replace("'versionName \"2026.08.05.v152-rapid-next-stability\"' in gradle",
                              "'versionName \"2026.08.06.v153-playback-stop-report\"' in gradle")
          path.write_text(text, encoding='utf-8')
          PY
          python3 scripts/check_v151_search_range_cache.py
          python3 scripts/check_v152_rapid_next_stability.py
          python3 scripts/check_v153_playback_stop.py
          grep -q 'versionCode 2026080153' app/build.gradle
          grep -q 'versionName "2026.08.06.v153-playback-stop-report"' app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages with five-minute watchdog
        run: |
          if [ -f scripts/run_with_no_output_watchdog.py ]; then
            python3 scripts/run_with_no_output_watchdog.py --silence-seconds 300 --log build/sdkmanager.log -- sdkmanager "platforms;android-35" "build-tools;37.0.0"
          else
            mkdir -p build
            sdkmanager "platforms;android-35" "build-tools;37.0.0" 2>&1 | tee build/sdkmanager.log
          fi

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build four v153 APKs
        run: |
          if [ -f scripts/run_with_no_output_watchdog.py ]; then
            python3 scripts/run_with_no_output_watchdog.py --silence-seconds 300 --log build/assemble-v153.log -- gradle --no-daemon assembleDebug
          else
            set -o pipefail
            gradle --no-daemon assembleDebug 2>&1 | tee build/assemble-v153.log
          fi

      - name: Verify v153 APK package names and version
        shell: bash
        run: |
          set -euo pipefail
          aapt="$ANDROID_HOME/build-tools/37.0.0/aapt"
          apksigner="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          declare -A expected=(
            [babywifeclassic]="com.jianglab.babywife"
            [lidacaizhu]="com.jianglab.babywife.lidacaizhu"
            [jianglab]="com.jianglab.babywife.jianglab"
            [niubi]="com.jianglab.babywife.niubi"
          )
          mkdir -p verified-apks
          for flavor in babywifeclassic lidacaizhu jianglab niubi; do
            apk="app/build/outputs/apk/${flavor}/debug/app-${flavor}-debug.apk"
            test -s "$apk"
            badging=$("$aapt" dump badging "$apk")
            package_name=$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            version_code=$(printf '%s\n' "$badging" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")
            test "$package_name" = "${expected[$flavor]}"
            test "$version_code" = "2026080153"
            "$apksigner" verify --verbose "$apk"
            cp "$apk" "verified-apks/${flavor}_v153_playback_stop_report.apk"
          done
          sha256sum verified-apks/*.apk | tee verified-apks/SHA256_v153.txt

      - name: Upload v153 playback-stop APKs and logs
        uses: actions/upload-artifact@v4
        with:
          name: v153-playback-stop-report-four-brand-apks
          path: |
            verified-apks/
            build/sdkmanager.log
            build/assemble-v153.log
          if-no-files-found: error
          retention-days: 14
