name: Build Four Brand Debug APKs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: four-brand-debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JIANG_LAB_PASSPHRASE_SHA256: ${{ secrets.JIANG_LAB_PASSPHRASE_SHA256 }}

jobs:
  build-four-brands:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify public repository
        run: |
          python3 scripts/check_public_repo.py
          python3 scripts/check_feature_requirements.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages with five-minute watchdog
        run: >-
          python3 scripts/run_with_no_output_watchdog.py
          --silence-seconds 300
          --log build/sdkmanager.log
          -- sdkmanager "platforms;android-35" "build-tools;37.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build four APKs with five-minute watchdog
        run: >-
          python3 scripts/run_with_no_output_watchdog.py
          --silence-seconds 300
          --log build/assemble-debug.log
          -- gradle --no-daemon assembleDebug

      - name: Verify APK files and package names
        shell: bash
        run: |
          set -euo pipefail
          aapt="$ANDROID_HOME/build-tools/37.0.0/aapt"
          apksigner="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          declare -A expected=(
            [babywifeclassic]="com.jianglab.babywife"
            [lidacaizhu]="com.jianglab.babywife.lidacaizhu"
            [jianglab]="com.jianglab.babywife.jianglab"
            [niubi]="com.jianglab.babywife.niubi"
          )
          mkdir -p verified-apks
          for flavor in babywifeclassic lidacaizhu jianglab niubi; do
            apk="app/build/outputs/apk/${flavor}/debug/app-${flavor}-debug.apk"
            test -s "$apk"
            package_name=$("$aapt" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            test "$package_name" = "${expected[$flavor]}"
            "$apksigner" verify --verbose "$apk"
            cp "$apk" "verified-apks/${flavor}.apk"
          done
          sha256sum verified-apks/*.apk | tee verified-apks/SHA256.txt

      - name: Upload four APKs and logs
        uses: actions/upload-artifact@v4
        with:
          name: four-brand-debug-apks
          path: |
            verified-apks/
            build/sdkmanager.log
            build/assemble-debug.log
          if-no-files-found: error
          retention-days: 14
