name: Build v155 Cache Recognition and Playlist Artwork Four Brands

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v155-cache-index-artwork-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JIANG_LAB_PASSPHRASE_SHA256: ${{ secrets.JIANG_LAB_PASSPHRASE_SHA256 }}

jobs:
  build-four-brands:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify v155 cache, artwork, UI and legacy functions
        run: |
          python3 scripts/check_public_repo.py
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'scripts/check_v154_preserve_current_features.py': [
                  ('versionCode 2026080154', 'versionCode 2026080155'),
                  ('2026.08.06.v154-media3-shared-cache',
                   '2026.08.06.v155-cache-index-playlist-artwork'),
              ],
              'scripts/check_v154_media3_shared_cache_artwork.py': [
                  ('versionCode 2026080154', 'versionCode 2026080155'),
                  ('2026.08.06.v154-media3-shared-cache',
                   '2026.08.06.v155-cache-index-playlist-artwork'),
                  ('"v154 metadata"', '"v155 metadata through v154 regression"'),
              ],
              'scripts/check_v153_playback_stop.py': [
                  ('versionCode 2026080153', 'versionCode 2026080155'),
                  ('2026.08.06.v153-playback-stop-report',
                   '2026.08.06.v155-cache-index-playlist-artwork'),
                  ('"v153 metadata"', '"v155 metadata through v153 regression"'),
              ],
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
          python3 scripts/check_v154_preserve_current_features.py
          python3 scripts/check_v154_media3_shared_cache_artwork.py
          python3 scripts/check_v153_playback_stop.py
          python3 scripts/check_v155_cache_index_playlist_artwork.py
          grep -q 'versionCode 2026080155' app/build.gradle
          grep -q 'versionName "2026.08.06.v155-cache-index-playlist-artwork"' app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages with five-minute watchdog
        run: |
          if [ -f scripts/run_with_no_output_watchdog.py ]; then
            python3 scripts/run_with_no_output_watchdog.py --silence-seconds 300 --log build/sdkmanager.log -- sdkmanager "platforms;android-35" "build-tools;37.0.0"
          else
            mkdir -p build
            sdkmanager "platforms;android-35" "build-tools;37.0.0" 2>&1 | tee build/sdkmanager.log
          fi

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build four v155 APKs
        run: |
          if [ -f scripts/run_with_no_output_watchdog.py ]; then
            python3 scripts/run_with_no_output_watchdog.py --silence-seconds 300 --log build/assemble-v155.log -- gradle --no-daemon assembleDebug
          else
            set -o pipefail
            gradle --no-daemon assembleDebug 2>&1 | tee build/assemble-v155.log
          fi

      - name: Verify v155 APK package names and version
        shell: bash
        run: |
          set -euo pipefail
          aapt="$ANDROID_HOME/build-tools/37.0.0/aapt"
          apksigner="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          declare -A expected=(
            [babywifeclassic]="com.jianglab.babywife"
            [lidacaizhu]="com.jianglab.babywife.lidacaizhu"
            [jianglab]="com.jianglab.babywife.jianglab"
            [niubi]="com.jianglab.babywife.niubi"
          )
          mkdir -p verified-apks
          for flavor in babywifeclassic lidacaizhu jianglab niubi; do
            apk="app/build/outputs/apk/${flavor}/debug/app-${flavor}-debug.apk"
            test -s "$apk"
            badging=$("$aapt" dump badging "$apk")
            package_name=$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            version_code=$(printf '%s\n' "$badging" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")
            test "$package_name" = "${expected[$flavor]}"
            test "$version_code" = "2026080155"
            "$apksigner" verify --verbose "$apk"
            cp "$apk" "verified-apks/${flavor}_v155_cache_index_playlist_artwork.apk"
          done
          sha256sum verified-apks/*.apk | tee verified-apks/SHA256_v155.txt

      - name: Upload v155 APKs and logs
        uses: actions/upload-artifact@v4
        with:
          name: v155-cache-index-playlist-artwork-four-brand-apks
          path: |
            verified-apks/
            build/sdkmanager.log
            build/assemble-v155.log
          if-no-files-found: error
          retention-days: 14
