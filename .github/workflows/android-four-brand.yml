name: Build v157 Source-Faithful Cache Export Four Brands

on:
  push:
    branches:
      - agent/v128-m4a-decrypt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v157-source-faithful-cache-direct
  cancel-in-progress: true

env:
  JIANG_LAB_PASSPHRASE_SHA256: ${{ secrets.JIANG_LAB_PASSPHRASE_SHA256 }}

jobs:
  build-four-brands:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Direct checkout without Marketplace Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin agent/v128-m4a-decrypt main --tags
          git checkout -B agent/v128-m4a-decrypt origin/agent/v128-m4a-decrypt
          git log -1 --oneline

      - name: Verify v157 and all retained functions
        run: |
          set -euo pipefail
          python3 scripts/check_public_repo.py
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'scripts/check_v154_preserve_current_features.py': [
                  ('versionCode 2026080154', 'versionCode 2026080757'),
                  ('2026.08.06.v154-media3-shared-cache', '2026.08.06.v157-source-faithful-cache-export'),
              ],
              'scripts/check_v154_media3_shared_cache_artwork.py': [
                  ('versionCode 2026080154', 'versionCode 2026080757'),
                  ('2026.08.06.v154-media3-shared-cache', '2026.08.06.v157-source-faithful-cache-export'),
                  ('"v154 metadata"', '"v157 metadata through v154 regression"'),
              ],
              'scripts/check_v153_playback_stop.py': [
                  ('versionCode 2026080153', 'versionCode 2026080757'),
                  ('2026.08.06.v153-playback-stop-report', '2026.08.06.v157-source-faithful-cache-export'),
                  ('"v153 metadata"', '"v157 metadata through v153 regression"'),
                  ('searchCacheExecutor = Executors.newSingleThreadExecutor()', 'searchCacheExecutor = Executors.newFixedThreadPool(2)'),
                  ('"existing v152 serialized player retained"', '"v152 serialized media-source player retained with v157 cache workers"'),
              ],
              'scripts/check_v155_cache_index_playlist_artwork.py': [
                  ('versionCode 2026080155', 'versionCode 2026080757'),
                  ('2026.08.06.v155-cache-index-playlist-artwork', '2026.08.06.v157-source-faithful-cache-export'),
                  ('"v155 metadata"', '"v157 metadata with v155 functions"'),
              ],
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
          python3 scripts/check_v154_preserve_current_features.py
          python3 scripts/check_v154_media3_shared_cache_artwork.py
          python3 scripts/check_v153_playback_stop.py
          python3 scripts/check_v155_cache_index_playlist_artwork.py
          python3 scripts/check_v157_source_fidelity_cache_export.py
          grep -q 'versionCode 2026080757' app/build.gradle
          grep -q 'versionName "2026.08.06.v157-source-faithful-cache-export"' app/build.gradle

      - name: Prepare fixed JDK 17 Android SDK and Gradle 8.7
        run: |
          set -euo pipefail
          mkdir -p build
          export JAVA_HOME="${JAVA_HOME_17_X64}"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version 2>&1 | tee build/java-version.log
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;37.0.0" 2>&1 | tee build/sdkmanager.log
          curl -fL --retry 5 --retry-delay 5 https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle-8.7-bin.zip
          rm -rf /tmp/gradle-8.7
          unzip -q /tmp/gradle-8.7-bin.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle --version | tee build/gradle-version.log

      - name: Build four v157 APKs
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64}"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$JAVA_HOME/bin:/tmp/gradle-8.7/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          set -o pipefail
          /tmp/gradle-8.7/bin/gradle --no-daemon assembleDebug 2>&1 | tee build/assemble-v157.log

      - name: Verify packages and prepare build archive
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          aapt="$ANDROID_HOME/build-tools/37.0.0/aapt"
          apksigner="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          declare -A expected=(
            [babywifeclassic]="com.jianglab.babywife"
            [lidacaizhu]="com.jianglab.babywife.lidacaizhu"
            [jianglab]="com.jianglab.babywife.jianglab"
            [niubi]="com.jianglab.babywife.niubi"
          )
          mkdir -p verified-apks
          for flavor in babywifeclassic lidacaizhu jianglab niubi; do
            apk="app/build/outputs/apk/${flavor}/debug/app-${flavor}-debug.apk"
            test -s "$apk"
            badging=$("$aapt" dump badging "$apk")
            package_name=$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            version_code=$(printf '%s\n' "$badging" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")
            test "$package_name" = "${expected[$flavor]}"
            test "$version_code" = "2026080757"
            "$apksigner" verify --verbose "$apk"
            cp "$apk" "verified-apks/${flavor}_v157_source_faithful_cache_export.apk"
          done
          sha256sum verified-apks/*.apk | tee verified-apks/SHA256_v157.txt
          zip -r -9 v157-source-faithful-cache-export-four-brand-apks.zip verified-apks build/java-version.log build/gradle-version.log build/sdkmanager.log build/assemble-v157.log
          sha256sum v157-source-faithful-cache-export-four-brand-apks.zip | tee v157-build-archive-sha256.txt

      - name: Upload v157 workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: v157-source-faithful-cache-export-four-brand-apks
          path: |
            verified-apks/
            build/assemble-v157.log
          if-no-files-found: error
          retention-days: 14

      - name: Publish temporary build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v157-ci-${GITHUB_RUN_ID}"
          gh release create "$tag" v157-source-faithful-cache-export-four-brand-apks.zip v157-build-archive-sha256.txt --repo "$GITHUB_REPOSITORY" --target agent/v128-m4a-decrypt --title "v157 CI build ${GITHUB_RUN_ID}" --notes "Temporary unsigned CI build for v157 verification." --prerelease
