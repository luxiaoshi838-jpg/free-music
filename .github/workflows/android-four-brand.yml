name: Build v149 Cache URI and Orphan Fix Four Brands

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v149-cache-uri-orphan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JIANG_LAB_PASSPHRASE_SHA256: ${{ secrets.JIANG_LAB_PASSPHRASE_SHA256 }}

jobs:
  build-four-brands:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify v149 cache URI and orphan fix
        run: |
          python3 scripts/check_public_repo.py
          if [ -f scripts/check_feature_requirements.py ]; then
            python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/check_feature_requirements.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace("'version bumped': 'versionCode 2026080143' in gradle,",
                              "'version bumped': 'versionCode 2026080149' in gradle,")
          text = text.replace("'PlayableAudioResolver.cachedAudioExists' in network",
                              "'CacheFileState.exists' in network")
          text = text.replace("and 'AudioPlaybackVerifier.isPlayableUri' in playable_resolver",
                              "and 'AudioPlaybackVerifier.probeFile' in playable_resolver")
          path.write_text(text, encoding='utf-8')
          PY
            python3 scripts/check_feature_requirements.py
          fi
          python3 scripts/check_v149_cache_uri_orphans.py
          grep -q 'versionCode 2026080149' app/build.gradle
          grep -q 'versionName "2026.08.05.v149-cache-uri-orphan-fix"' app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages with five-minute watchdog
        run: |
          if [ -f scripts/run_with_no_output_watchdog.py ]; then
            python3 scripts/run_with_no_output_watchdog.py --silence-seconds 300 --log build/sdkmanager.log -- sdkmanager "platforms;android-35" "build-tools;37.0.0"
          else
            mkdir -p build
            sdkmanager "platforms;android-35" "build-tools;37.0.0" 2>&1 | tee build/sdkmanager.log
          fi

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build four v149 APKs
        run: |
          if [ -f scripts/run_with_no_output_watchdog.py ]; then
            python3 scripts/run_with_no_output_watchdog.py --silence-seconds 300 --log build/assemble-v149.log -- gradle --no-daemon assembleDebug
          else
            set -o pipefail
            gradle --no-daemon assembleDebug 2>&1 | tee build/assemble-v149.log
          fi

      - name: Verify v149 APK package names and version
        shell: bash
        run: |
          set -euo pipefail
          aapt="$ANDROID_HOME/build-tools/37.0.0/aapt"
          apksigner="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          declare -A expected=(
            [babywifeclassic]="com.jianglab.babywife"
            [lidacaizhu]="com.jianglab.babywife.lidacaizhu"
            [jianglab]="com.jianglab.babywife.jianglab"
            [niubi]="com.jianglab.babywife.niubi"
          )
          mkdir -p verified-apks
          for flavor in babywifeclassic lidacaizhu jianglab niubi; do
            apk="app/build/outputs/apk/${flavor}/debug/app-${flavor}-debug.apk"
            test -s "$apk"
            badging=$("$aapt" dump badging "$apk")
            package_name=$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            version_code=$(printf '%s\n' "$badging" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")
            test "$package_name" = "${expected[$flavor]}"
            test "$version_code" = "2026080149"
            "$apksigner" verify --verbose "$apk"
            cp "$apk" "verified-apks/${flavor}_v149_cache_uri_orphan_fix.apk"
          done
          sha256sum verified-apks/*.apk | tee verified-apks/SHA256_v149.txt

      - name: Upload v149 cache-uri-orphan APKs and logs
        uses: actions/upload-artifact@v4
        with:
          name: v149-cache-uri-orphan-fix-four-brand-apks
          path: |
            verified-apks/
            build/sdkmanager.log
            build/assemble-v149.log
          if-no-files-found: error
          retention-days: 14
