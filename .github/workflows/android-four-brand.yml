name: Build v159 Cache State Recovery Four Brands

on:
  push:
    branches:
      - agent/v128-m4a-decrypt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v159-cache-state-recovery
  cancel-in-progress: true

env:
  JIANG_LAB_PASSPHRASE_SHA256: ${{ secrets.JIANG_LAB_PASSPHRASE_SHA256 }}

jobs:
  build-four-brands:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Direct checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin agent/v128-m4a-decrypt main --tags
          git checkout -B agent/v128-m4a-decrypt origin/agent/v128-m4a-decrypt
          git log -1 --oneline

      - name: Verify retained features and v159 cache-state recovery
        run: |
          set -euo pipefail
          python3 scripts/check_public_repo.py
          python3 - <<'PY'
          from pathlib import Path
          files = [
              'scripts/check_v154_preserve_current_features.py',
              'scripts/check_v154_media3_shared_cache_artwork.py',
              'scripts/check_v153_playback_stop.py',
              'scripts/check_v155_cache_index_playlist_artwork.py',
              'scripts/check_v157_source_fidelity_cache_export.py',
          ]
          replacements = [
              ('versionCode 2026080154', 'versionCode 2026080759'),
              ('versionCode 2026080153', 'versionCode 2026080759'),
              ('versionCode 2026080155', 'versionCode 2026080759'),
              ('versionCode 2026080757', 'versionCode 2026080759'),
              ('2026.08.06.v154-media3-shared-cache', '2026.08.07.v159-cache-state-recovery'),
              ('2026.08.06.v153-playback-stop-report', '2026.08.07.v159-cache-state-recovery'),
              ('2026.08.06.v155-cache-index-playlist-artwork', '2026.08.07.v159-cache-state-recovery'),
              ('2026.08.06.v157-source-faithful-cache-export', '2026.08.07.v159-cache-state-recovery'),
              ('searchCacheExecutor = Executors.newSingleThreadExecutor()', 'searchCacheExecutor = Executors.newFixedThreadPool(2)'),
              ('"existing v152 serialized player retained"', '"v152 serialized media-source player retained with v159 cache workers"'),
          ]
          for filename in files:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
          python3 scripts/check_v154_preserve_current_features.py
          python3 scripts/check_v154_media3_shared_cache_artwork.py
          python3 scripts/check_v153_playback_stop.py
          python3 scripts/check_v155_cache_index_playlist_artwork.py
          python3 scripts/check_v157_source_fidelity_cache_export.py
          python3 scripts/check_v159_cache_state_recovery.py
          grep -q 'versionCode 2026080759' app/build.gradle
          grep -q 'versionName "2026.08.07.v159-cache-state-recovery"' app/build.gradle
          grep -q 'recoverCachedSongState' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'setCacheWriteDataSinkFactory(null)' app/src/main/java/com/jianglab/babywife/Media3FriendlyCacheExporter.java
          ! grep -q '^import androidx.media3.datasource.cache.CacheWriter;' app/src/main/java/com/jianglab/babywife/Media3FriendlyCacheExporter.java
          ! grep -q 'setFlags(CacheDataSource.FLAG_BLOCK_ON_CACHE)' app/src/main/java/com/jianglab/babywife/Media3FriendlyCacheExporter.java
          git diff --name-only 50846752e1866d603557af30ba8734671cd3d89d HEAD | grep -E '^app/src/main/res/' && exit 1 || true

      - name: Prepare JDK 17 Android SDK and Gradle 8.7
        run: |
          set -euo pipefail
          mkdir -p build
          export JAVA_HOME="${JAVA_HOME_17_X64}"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version 2>&1 | tee build/java-version.log
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;37.0.0" 2>&1 | tee build/sdkmanager.log
          curl -fL --retry 5 --retry-delay 5 https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle-8.7-bin.zip
          rm -rf /tmp/gradle-8.7
          unzip -q /tmp/gradle-8.7-bin.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle --version | tee build/gradle-version.log

      - name: Build four v159 APKs
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64}"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$JAVA_HOME/bin:/tmp/gradle-8.7/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          set -o pipefail
          /tmp/gradle-8.7/bin/gradle --no-daemon assembleDebug 2>&1 | tee build/assemble-v159.log

      - name: Verify packages and prepare archive
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          aapt="$ANDROID_HOME/build-tools/37.0.0/aapt"
          apksigner="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          declare -A expected=(
            [babywifeclassic]="com.jianglab.babywife"
            [lidacaizhu]="com.jianglab.babywife.lidacaizhu"
            [jianglab]="com.jianglab.babywife.jianglab"
            [niubi]="com.jianglab.babywife.niubi"
          )
          mkdir -p verified-apks
          for flavor in babywifeclassic lidacaizhu jianglab niubi; do
            apk="app/build/outputs/apk/${flavor}/debug/app-${flavor}-debug.apk"
            test -s "$apk"
            badging=$("$aapt" dump badging "$apk")
            package_name=$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            version_code=$(printf '%s\n' "$badging" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")
            test "$package_name" = "${expected[$flavor]}"
            test "$version_code" = "2026080759"
            "$apksigner" verify --verbose "$apk"
            cp "$apk" "verified-apks/${flavor}_v159_cache_state_recovery.apk"
          done
          sha256sum verified-apks/*.apk | tee verified-apks/SHA256_v159.txt
          zip -r -9 v159-cache-state-recovery-four-brand-apks.zip verified-apks build/assemble-v159.log
          sha256sum v159-cache-state-recovery-four-brand-apks.zip | tee v159-build-archive-sha256.txt

      - name: Upload v159 workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: v159-cache-state-recovery-four-brand-apks
          path: |
            verified-apks/
            build/assemble-v159.log
          if-no-files-found: error
          retention-days: 14

      - name: Publish temporary build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v159-ci-${GITHUB_RUN_ID}"
          gh release create "$tag" v159-cache-state-recovery-four-brand-apks.zip v159-build-archive-sha256.txt --repo "$GITHUB_REPOSITORY" --target agent/v128-m4a-decrypt --title "v159 CI build ${GITHUB_RUN_ID}" --notes "Temporary unsigned CI build for v159 verification." --prerelease
