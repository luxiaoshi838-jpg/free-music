name: Fix v152 Duplicate onDestroy

on:
  push:
    branches:
      - agent/v128-m4a-decrypt

permissions:
  contents: write

jobs:
  merge-ondestroy:
    if: ${{ !contains(github.event.head_commit.message, '[v152-ondestroy-merged]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/v128-m4a-decrypt
          fetch-depth: 0

      - name: Merge lifecycle cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/jianglab/babywife/MainActivity.java')
          text = path.read_text(encoding='utf-8')

          duplicate = '''    @Override
              protected void onDestroy() {
                  activityDestroyed = true;
                  clearPendingPlaybackNavigation();
                  cancelMediaSourceOpenTask();
                  cancelSearchCacheTask();
                  mediaSourceExecutor.shutdownNow();
                  searchCacheExecutor.shutdownNow();
                  stopPlayback();
                  super.onDestroy();
              }

          '''
          # Normalize indentation from the Java source itself rather than trusting YAML display.
          duplicate = duplicate.replace('              ', '    ')
          if text.count(duplicate) != 1:
              raise SystemExit(f'expected one v152 duplicate onDestroy, found {text.count(duplicate)}')
          text = text.replace(duplicate, '', 1)

          original_start = '''    @Override
              protected void onDestroy() {
                  if (mediaPlayer != null && currentSong != null) {
          '''.replace('              ', '    ')
          merged_start = '''    @Override
              protected void onDestroy() {
                  activityDestroyed = true;
                  clearPendingPlaybackNavigation();
                  cancelMediaSourceOpenTask();
                  cancelSearchCacheTask();
                  mediaSourceExecutor.shutdownNow();
                  searchCacheExecutor.shutdownNow();
                  if (mediaPlayer != null && currentSong != null) {
          '''.replace('              ', '    ')
          if text.count(original_start) != 1:
              raise SystemExit(f'expected one original onDestroy, found {text.count(original_start)}')
          text = text.replace(original_start, merged_start, 1)

          if text.count('protected void onDestroy()') != 1:
              raise SystemExit('onDestroy merge did not produce exactly one method')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify merged lifecycle
        run: |
          test "$(grep -c 'protected void onDestroy()' app/src/main/java/com/jianglab/babywife/MainActivity.java)" = 1
          grep -q 'activityDestroyed = true;' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'mediaSourceExecutor.shutdownNow();' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'playlistCacheScanExecutor.shutdownNow();' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'unregisterReceiver(playbackCommandReceiver);' app/src/main/java/com/jianglab/babywife/MainActivity.java
          git diff --check

      - name: Commit merged source
        run: |
          if git diff --quiet; then
            echo 'Lifecycle already merged.'
            exit 0
          fi
          git config user.name 'luxiaoshi838-jpg'
          git config user.email 'luxiaoshi838@gmail.com'
          git add app/src/main/java/com/jianglab/babywife/MainActivity.java
          git commit -m 'Merge v152 onDestroy cleanup [v152-ondestroy-merged] [skip ci]'
          git push origin HEAD:agent/v128-m4a-decrypt
