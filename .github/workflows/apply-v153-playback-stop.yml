              '        publishPlaybackControlState(true);\n',
              'resume health state'
          )

          main = replace_once(
              main,
              '    private void stopPlayback() {\n'
              '        cancelMediaSourceOpenTask();\n',
              '    private void stopPlayback() {\n'
              '        playbackPreparing = false;\n'
              '        playbackUserPaused = false;\n'
              '        stopPlaybackHealthWatch();\n'
              '        cancelMediaSourceOpenTask();\n',
              'stop health state'
          )

          main = replace_once(
              main,
              '    protected void onDestroy() {\n'
              '        activityDestroyed = true;\n',
              '    protected void onDestroy() {\n'
              '        if (playbackExpectedPlaying && mediaPlayer != null) {\n'
              '            persistPlaybackInterruptionReport(\n'
              '                "activity-destroyed-during-active-playback", mediaPlayer, 0, 0,\n'
              '                currentSong == null ? "" : currentSong.uri);\n'
              '        }\n'
              '        activityDestroyed = true;\n'
              '        playbackHealthHandler.removeCallbacks(playbackHealthTicker);\n',
              'destroy report'
          )

          main = main.replace('"\\u95ea\\u9000/\\u65e0\\u54cd\\u5e94\\u62a5\\u544a"', '"播放/闪退报告"')
          main = main.replace('"\\u4e0a\\u6b21\\u95ea\\u9000/\\u65e0\\u54cd\\u5e94\\u62a5\\u544a"', '"上次播放/闪退问题报告"')
          main = main.replace('"\\u6682\\u65e0\\u95ea\\u9000/\\u65e0\\u54cd\\u5e94\\u62a5\\u544a"', '"暂无播放/闪退问题报告"')
          main = main.replace('"\\u95ea\\u9000/\\u65e0\\u54cd\\u5e94\\u62a5\\u544a\\u5df2\\u590d\\u5236"', '"播放/闪退问题报告已复制"')

          main_path.write_text(main, encoding='utf-8')

          search_path = Path('app/src/main/java/com/jianglab/babywife/SearchQuickPlayback.java')
          search = search_path.read_text(encoding='utf-8')

          range_class_anchor = '''    private static final class RangeResponse {
          '''
          range_class = '''    private static final class ContentRange {
              final long start;
              final long end;
              final long total;

              ContentRange(long start, long end, long total) {
                  this.start = start;
                  this.end = end;
                  this.total = total;
              }
          }

          '''.replace('          ', '')
          search = replace_once(search, range_class_anchor, range_class + range_class_anchor,
                                'content range class')

          old_loop = re.search(
              r'    private static void downloadByRanges\(Candidate candidate, File output\) throws Exception \{.*?^    \}\n\n    private static RangeResponse openRange',
              search, flags=re.S | re.M)
          if not old_loop:
              raise SystemExit('downloadByRanges method not found')
          new_loop = '''    private static void downloadByRanges(Candidate candidate, File output) throws Exception {
              long writtenTotal = 0L;
              long expectedTotal = -1L;
              boolean complete = false;
              int segment = 0;

              try (OutputStream stream = new BufferedOutputStream(new FileOutputStream(output, false))) {
                  while (!complete) {
                      throwIfInterrupted();
                      if (writtenTotal >= MAX_AUDIO_BYTES) {
                          throw new IllegalStateException("音频文件超过缓存大小限制");
                      }
                      long rangeEnd = Math.min(MAX_AUDIO_BYTES - 1L,
                          writtenTotal + RANGE_CHUNK_BYTES - 1L);
                      RangeResponse response = openRange(candidate, writtenTotal, rangeEnd);
                      long segmentBytes = 0L;
                      try {
                          ContentRange bounds = parseContentRange(response.contentRange);
                          if (response.statusCode == HttpURLConnection.HTTP_REQUESTED_RANGE_NOT_SATISFIABLE) {
                              long total = bounds == null ? -1L : bounds.total;
                              if (writtenTotal > 0L && total > 0L && writtenTotal == total) {
                                  expectedTotal = total;
                                  complete = true;
                                  continue;
                              }
                              throw new IllegalStateException(downloadDiagnostic(response, writtenTotal,
                                  "Range 超出范围但已写入长度与总长度不一致"));
                          }
                          if (response.statusCode != HttpURLConnection.HTTP_OK
                              && response.statusCode != HttpURLConnection.HTTP_PARTIAL) {
                              throw new IllegalStateException(downloadDiagnostic(response, writtenTotal,
                                  "HTTP 状态不可下载"));
                          }
                          if (response.statusCode == HttpURLConnection.HTTP_OK && writtenTotal > 0L) {
                              throw new IllegalStateException(downloadDiagnostic(response, writtenTotal,
                                  "后续分段被服务器改为完整响应"));
                          }
                          if (response.statusCode == HttpURLConnection.HTTP_PARTIAL && bounds != null) {
                              if (bounds.start >= 0L && bounds.start != writtenTotal) {
                                  throw new IllegalStateException(downloadDiagnostic(response, writtenTotal,
                                      "Range 起点不连续，期望 " + writtenTotal + "，实际 " + bounds.start));
                              }
                              if (bounds.total > 0L) expectedTotal = bounds.total;
                          }
                          if (expectedTotal > MAX_AUDIO_BYTES) {
                              throw new IllegalStateException("音频文件超过缓存大小限制");
                          }

                          try (InputStream input = new BufferedInputStream(
                              response.connection.getInputStream())) {
                              byte[] buffer = new byte[64 * 1024];
                              int read;
                              while ((read = input.read(buffer)) >= 0) {
                                  throwIfInterrupted();
                                  if (read == 0) continue;
                                  segmentBytes += read;
                                  writtenTotal += read;
                                  if (writtenTotal > MAX_AUDIO_BYTES) {
                                      throw new IllegalStateException("音频文件超过缓存大小限制");
                                  }
                                  stream.write(buffer, 0, read);
                              }
                          }

                          if (segmentBytes <= 0L) {
                              throw new IllegalStateException(downloadDiagnostic(response, writtenTotal,
                                  "Range 响应正文为 0 字节"));
                          }
                          segment++;
                          if (response.statusCode == HttpURLConnection.HTTP_OK) {
                              expectedTotal = response.contentLength > 0L
                                  ? response.contentLength : writtenTotal;
                              complete = true;
                          } else if (expectedTotal > 0L && writtenTotal >= expectedTotal) {
                              complete = writtenTotal == expectedTotal;
                              if (!complete) {
                                  throw new IllegalStateException(downloadDiagnostic(response, writtenTotal,
                                      "已写入长度超过 Content-Range 总长度"));
                              }
                          } else if (segment > 512) {
                              throw new IllegalStateException("Range 分段数量异常，已停止下载");
                          }
                      } finally {
                          response.connection.disconnect();
                      }
                  }
                  stream.flush();
              }

              if (!complete || writtenTotal <= 0L || !output.isFile()
                  || output.length() != writtenTotal) {
                  throw new IllegalStateException("Range 分段下载未生成完整音频文件");
              }
              if (expectedTotal > 0L && writtenTotal != expectedTotal) {
                  throw new IllegalStateException("Range 下载长度不完整：期望 "
                      + expectedTotal + " 字节，实际 " + writtenTotal + " 字节");
              }
          }

          private static RangeResponse openRange'''.replace('          ', '')
          search = search[:old_loop.start()] + new_loop + search[old_loop.end():]

          old_parser = re.search(
              r'    private static long parseContentRangeTotal\(String value\) \{.*?^    \}\n',
              search, flags=re.S | re.M)
          if not old_parser:
              raise SystemExit('old Content-Range parser not found')
          new_parser = '''    private static ContentRange parseContentRange(String value) {
              if (value == null || value.trim().isEmpty()) return null;
              String text = value.trim();
              try {
                  if (text.startsWith("bytes */")) {
                      long total = Long.parseLong(text.substring("bytes */".length()).trim());
                      return new ContentRange(-1L, -1L, total);
                  }
                  if (!text.startsWith("bytes ")) return null;
                  String body = text.substring(6).trim();
                  int slash = body.lastIndexOf('/');
                  int dash = body.indexOf('-');
                  if (slash < 0 || dash < 0 || dash >= slash) return null;
                  long start = Long.parseLong(body.substring(0, dash).trim());
                  long end = Long.parseLong(body.substring(dash + 1, slash).trim());
                  String totalText = body.substring(slash + 1).trim();
                  long total = "*".equals(totalText) ? -1L : Long.parseLong(totalText);
                  return new ContentRange(start, end, total);
              } catch (Exception ignored) {
                  return null;
              }
          }
          '''.replace('          ', '')
          search = search[:old_parser.start()] + new_parser + search[old_parser.end():]

          if 'segmentBytes < RANGE_CHUNK_BYTES' in search:
              raise SystemExit('short Range response is still treated as complete')
          search_path.write_text(search, encoding='utf-8')
          PY

