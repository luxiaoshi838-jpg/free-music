              '        } else {\n'
              '            mediaPlayer.start();\n'
              '            playButton.setText("Ⅱ");\n'
              '            lyricHandler.post(lyricTicker);\n'
              '        }\n'
              '        publishPlaybackControlState(true);\n',
              '        } else {\n'
              '            mediaPlayer.start();\n'
