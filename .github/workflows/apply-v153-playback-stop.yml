name: Apply v153 Playback Stop Fix

on:
  push:
    branches:
      - agent/v128-m4a-decrypt

permissions:
  contents: write

jobs:
  apply-v153:
    if: ${{ !contains(github.event.head_commit.message, '[v153-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/v128-m4a-decrypt
          fetch-depth: 0

      - name: Patch Range completeness and playback interruption reporting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          main_path = Path('app/src/main/java/com/jianglab/babywife/MainActivity.java')
          main = main_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          main = replace_once(
              main,
              '    private static final long PLAYBACK_NAVIGATION_DEBOUNCE_MS = 220L;\n',
              '    private static final long PLAYBACK_NAVIGATION_DEBOUNCE_MS = 220L;\n'
              '    private static final long PLAYBACK_HEALTH_CHECK_INTERVAL_MS = 2000L;\n'
              '    private static final long PLAYBACK_STALL_REPORT_MS = 12000L;\n',
              'health constants'
          )

          main = replace_once(
              main,
              '    private final Handler responsivenessHandler = new Handler(Looper.getMainLooper());\n',
              '    private final Handler responsivenessHandler = new Handler(Looper.getMainLooper());\n'
              '    private final Handler playbackHealthHandler = new Handler(Looper.getMainLooper());\n',
              'health handler'
          )

          main = replace_once(
              main,
              '    private volatile boolean activityDestroyed = false;\n',
              '    private volatile boolean activityDestroyed = false;\n'
              '    private boolean playbackPreparing = false;\n'
              '    private boolean playbackExpectedPlaying = false;\n'
              '    private boolean playbackUserPaused = false;\n'
              '    private long playbackLastObservedPosition = -1L;\n'
              '    private long playbackLastProgressTime = 0L;\n'
              '    private boolean playbackSilentStopReported = false;\n',
              'health state'
          )

          ticker_anchor = '''    private final Runnable responsivenessHeartbeat = new Runnable() {
              @Override
              public void run() {
                  lastUiHeartbeatMs = System.currentTimeMillis();
                  noResponseReportWritten = false;
                  if (responsivenessWatchdogRunning && activityResumed
                      && windowFocused && isDeviceInteractive()) {
                      responsivenessHandler.postDelayed(this, UI_HEARTBEAT_INTERVAL_MS);
                  }
              }
          };
          '''.replace('              ', '    ')
          ticker_new = ticker_anchor + '''    private final Runnable playbackHealthTicker = new Runnable() {
              @Override
              public void run() {
                  checkPlaybackHealth();
                  if (playbackExpectedPlaying && !activityDestroyed) {
                      playbackHealthHandler.postDelayed(this, PLAYBACK_HEALTH_CHECK_INTERVAL_MS);
                  }
              }
          };
          '''.replace('              ', '    ')
          main = replace_once(main, ticker_anchor, ticker_new, 'health ticker')

          report_anchor = '''    private void persistCrashReport(Thread thread, Throwable throwable) {
          '''
          report_methods = '''    private void persistPlaybackInterruptionReport(String reason, MediaPlayer player,
                                                           int what, int extra, String playbackUri) {
              try {
                  StringBuilder report = new StringBuilder();
                  report.append("Playback interruption report\\n");
                  appendReportContext(report, "media-player");
                  report.append("reason=").append(reason == null ? "" : reason).append('\\n');
                  report.append("what=").append(what).append('\\n');
                  report.append("extra=").append(extra).append('\\n');
                  report.append("playbackUri=").append(trimForReport(playbackUri, 600)).append('\\n');
                  report.append("preparing=").append(playbackPreparing).append('\\n');
                  report.append("expectedPlaying=").append(playbackExpectedPlaying).append('\\n');
                  report.append("userPaused=").append(playbackUserPaused).append('\\n');
                  report.append("playerPositionMs=").append(safePlayerPosition(player)).append('\\n');
                  report.append("playerDurationMs=").append(safePlayerDuration(player)).append('\\n');
                  report.append("playerIsPlaying=").append(safePlayerIsPlaying(player)).append('\\n');
                  report.append("catalogExpectedDurationMs=")
                      .append(expectedCatalogDurationMs(currentSong == null ? "" : currentSong.catalogJson))
                      .append('\\n');
                  storeProblemReport(report.toString());
              } catch (Throwable ignored) {
              }
          }

          private long safePlayerPosition(MediaPlayer player) {
              if (player == null) return -1L;
              try {
                  return player.getCurrentPosition();
              } catch (Exception ignored) {
                  return -1L;
              }
          }

          private long safePlayerDuration(MediaPlayer player) {
              if (player == null) return -1L;
              try {
                  return player.getDuration();
              } catch (Exception ignored) {
                  return -1L;
              }
          }

          private boolean safePlayerIsPlaying(MediaPlayer player) {
              if (player == null) return false;
              try {
                  return player.isPlaying();
              } catch (Exception ignored) {
                  return false;
              }
          }

          private long expectedCatalogDurationMs(String catalogJson) {
              if (catalogJson == null || catalogJson.trim().isEmpty()) return -1L;
              try {
                  JSONObject object = new JSONObject(catalogJson);
                  String[] millisecondKeys = {"duration_ms", "durationMs", "dt"};
                  for (String key : millisecondKeys) {
                      long value = object.optLong(key, -1L);
                      if (value > 1000L && value < 4L * 60L * 60L * 1000L) return value;
                  }
                  String[] flexibleKeys = {"duration", "interval", "time", "length"};
                  for (String key : flexibleKeys) {
                      double value = object.optDouble(key, -1.0);
                      if (value <= 0.0) continue;
                      long millis = value <= 10000.0
                          ? Math.round(value * 1000.0) : Math.round(value);
                      if (millis > 1000L && millis < 4L * 60L * 60L * 1000L) return millis;
                  }
              } catch (Exception ignored) {
              }
              return -1L;
          }

          private boolean cachedDurationClearlyShort(Song song, String playbackUri, long actualDurationMs) {
              if (song == null || !song.isNetworkCatalog()) return false;
              if (playbackUri == null || playbackUri.startsWith("http://")
                  || playbackUri.startsWith("https://")) return false;
              long expected = expectedCatalogDurationMs(song.catalogJson);
              if (expected <= 0L || actualDurationMs <= 0L) return false;
              long shortBy = expected - actualDurationMs;
              return shortBy >= 15000L && actualDurationMs * 100L < expected * 90L;
          }

          private void deleteIncompleteNetworkCache(Song song, String playbackUri) {
              if (song == null) return;
              try {
                  CacheFileState.deleteDirect(this, playbackUri);
              } catch (Exception ignored) {
              }
              try {
                  String key = NetworkMediaCache.cacheKeyForCatalog(song.catalogJson);
                  if (key != null && !key.trim().isEmpty()) CacheStorage.deleteKey(this, key);
              } catch (Exception ignored) {
              }
              song.cachedUri = "";
              song.uri = "";
              savePlaylists();
          }

          private void startPlaybackHealthWatch(MediaPlayer player) {
              playbackExpectedPlaying = true;
              playbackUserPaused = false;
              playbackSilentStopReported = false;
              playbackLastObservedPosition = safePlayerPosition(player);
              playbackLastProgressTime = System.currentTimeMillis();
              playbackHealthHandler.removeCallbacks(playbackHealthTicker);
              playbackHealthHandler.postDelayed(
                  playbackHealthTicker, PLAYBACK_HEALTH_CHECK_INTERVAL_MS);
          }

          private void stopPlaybackHealthWatch() {
              playbackExpectedPlaying = false;
              playbackHealthHandler.removeCallbacks(playbackHealthTicker);
          }

          private void checkPlaybackHealth() {
              if (!playbackExpectedPlaying || playbackPreparing || playbackUserPaused
                  || activityDestroyed) return;
              MediaPlayer player = mediaPlayer;
              if (player == null) {
                  if (!playbackSilentStopReported) {
                      playbackSilentStopReported = true;
                      persistPlaybackInterruptionReport(
                          "player-disappeared-without-error-callback", null, 0, 0,
                          currentSong == null ? "" : currentSong.uri);
                  }
                  stopPlaybackHealthWatch();
                  return;
              }
              long now = System.currentTimeMillis();
              long position = safePlayerPosition(player);
              long duration = safePlayerDuration(player);
              boolean playing = safePlayerIsPlaying(player);
              if (position >= 0L && position > playbackLastObservedPosition + 250L) {
                  playbackLastObservedPosition = position;
                  playbackLastProgressTime = now;
                  playbackSilentStopReported = false;
                  return;
              }
              boolean nearEnd = duration > 0L && position >= 0L && position + 3000L >= duration;
              if (!nearEnd && now - playbackLastProgressTime >= PLAYBACK_STALL_REPORT_MS
                  && !playbackSilentStopReported) {
                  playbackSilentStopReported = true;
                  persistPlaybackInterruptionReport(
                      playing ? "playback-position-stalled" : "playback-stopped-without-callback",
                      player, 0, 0, currentSong == null ? "" : currentSong.uri);
                  if (!playing) {
                      try {
                          player.start();
                          playbackLastProgressTime = now;
                          playbackSilentStopReported = false;
                          if (statusView != null) {
                              statusView.setText("检测到播放意外停止，已尝试自动恢复");
                          }
                      } catch (Exception ignored) {
                          stopPlaybackHealthWatch();
                          if (playButton != null) playButton.setText("▶");
                          if (statusView != null) {
                              statusView.setText("播放意外停止，已生成播放问题报告");
                          }
                      }
                  }
              }
          }

          '''.replace('          ', '')
          main = replace_once(main, report_anchor, report_methods + report_anchor, 'report methods')

          main = replace_once(
              main,
              '    private void startLocalPlayback(Song song, int playToken, Runnable onStarted, Runnable onFailed) {\n'
              '        stopPlayback();\n',
