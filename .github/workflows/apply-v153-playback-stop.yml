                                      if (onFailed != null) onFailed.run();
                                      return;
                                  }
                                  player.start();
                                  onPlaybackStarted(song, onStarted);
                              } catch (Exception error) {
          '''.replace('                                  ', '    ')
          main = replace_once(main, old_prepared_try, new_prepared_try, 'prepared duration validation')

          main = replace_once(
              main,
              '                        } catch (Exception error) {\n'
              '                            mediaPlayer = null;\n'
              '                            releaseMediaPlayer(player);\n'
              '                            lyricHandler.removeCallbacks(lyricTicker);\n',
              '                        } catch (Exception error) {\n'
              '                            persistPlaybackInterruptionReport(\n'
              '                                "player-start-exception", player, 0, 0, playbackUri);\n'
