                                  if (onFailed != null) onFailed.run();
                                  publishPlaybackControlState(true);
                              } else {
                                  releaseMediaPlayer(player);
                              }
                              return true;
                          });
          '''.replace('                              ', '    ')
          main = replace_once(main, old_error, new_error, 'error listener')

          old_prepared_try = '''                        try {
                                  player.start();
                                  onPlaybackStarted(song, onStarted);
                              } catch (Exception error) {
          '''.replace('                                  ', '    ')
          new_prepared_try = '''                        try {
                                  long actualDuration = safePlayerDuration(player);
                                  if (cachedDurationClearlyShort(song, playbackUri, actualDuration)) {
                                      persistPlaybackInterruptionReport(
                                          "cached-duration-short-before-start",
                                          player, 0, 0, playbackUri);
                                      playbackPreparing = false;
                                      mediaPlayer = null;
                                      releaseMediaPlayer(player);
