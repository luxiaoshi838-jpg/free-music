name: Build v140 stable local lyric cache

on:
  push:
    branches:
      - agent/v128-m4a-decrypt
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v128-m4a-decrypt
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Apply v140 patch when needed
        run: |
          if grep -q 'versionCode 2026080140' app/build.gradle; then
            echo 'v140 source already present'
          else
            python scripts/apply_v140_stable_local_lyric_cache_patch.py
          fi
      - name: Verify feature requirements
        run: python scripts/check_feature_requirements.py
      - name: Assert stable local lyric cache path
        run: |
          python - <<'PY'
          from pathlib import Path
          main = Path('app/src/main/java/com/jianglab/babywife/MainActivity.java').read_text(encoding='utf-8')
          cache = Path('app/src/main/java/com/jianglab/babywife/CacheStorage.java').read_text(encoding='utf-8')
          network = Path('app/src/main/java/com/jianglab/babywife/NetworkMediaCache.java').read_text(encoding='utf-8')
          start = main.index('private void onPlaybackStarted')
          end = main.index('private void togglePlayback', start)
          block = main[start:end]
          assert block.index('if (onStarted != null) onStarted.run();') < block.index('if (song.isNetworkCatalog()) showSongLyrics(song);')
          cache_start = main.index('private void cacheAndPlay')
          cache_end = main.index('private String stripVisibleLyricTags', cache_start)
          cache_block = main[cache_start:cache_end]
          assert 'showSongLyrics(song);\n                    startLocalPlayback' not in cache_block
          assert 'readLyricForSong(Context context, String preferredKey' in cache
          assert 'LYRIC_INDEX_PREFS = "lyric_cache_index"' in cache
          assert 'writeLyric(context, keepKey, oldLyric' in cache
          assert 'CacheStorage.readLyricForSong(context, actualKey' in network
          assert 'CacheStorage.readLyricForSong(this, key, song.title, song.artist)' in main
          print('v140 local lyric cache assertions passed')
          PY
      - name: Build four release APKs
        run: |
          gradle --no-daemon \
            :app:assembleBabywifeclassicRelease \
            :app:assembleJianglabRelease \
            :app:assembleLidacaizhuRelease \
            :app:assembleNiubiRelease
      - uses: actions/upload-artifact@v4
        with:
          name: v140-four-unsigned-release-apks
          path: app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error
      - name: Commit formal source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle \
            app/src/main/java/com/jianglab/babywife/MainActivity.java \
            app/src/main/java/com/jianglab/babywife/CacheStorage.java \
            app/src/main/java/com/jianglab/babywife/NetworkMediaCache.java \
            scripts/check_feature_requirements.py PROJECT_LOG.md docs/CHANGELOG.md
          if git diff --cached --quiet; then
            echo 'No formal source changes to commit'
          else
            git commit -m 'Repair stable local lyric cache reads [skip ci]'
            git push origin HEAD:agent/v128-m4a-decrypt
          fi
