name: Build v172 Compact Search Mode

on:
  push:
    branches: [agent/v172-compact-search-mode]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout v172 branch
        uses: actions/checkout@v4
        with:
          ref: agent/v172-compact-search-mode
          fetch-depth: 0

      - name: Apply compact search-mode control
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('app/build.gradle')
          g = gradle.read_text(encoding='utf-8')
          if 'versionCode 2026080871' in g:
              g = g.replace('versionCode 2026080871', 'versionCode 2026080872', 1)
          if 'versionName "2026.08.08.v171-search-match-mode"' in g:
              g = g.replace('versionName "2026.08.08.v171-search-match-mode"', 'versionName "2026.08.08.v172-compact-search-mode"', 1)
          if 'versionCode 2026080872' not in g or 'versionName "2026.08.08.v172-compact-search-mode"' not in g:
              raise SystemExit('v172 version patch failed')
          gradle.write_text(g, encoding='utf-8')

          path = Path('app/src/main/java/com/jianglab/babywife/MainActivity.java')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('searchInput.setPadding(dp(72), 0, dp(48), 0);', 'searchInput.setPadding(dp(34), 0, dp(48), 0);'),
              ('searchMatchModeButton.setTextSize(12);', 'searchMatchModeButton.setTextSize(9);'),
              ('new FrameLayout.LayoutParams(dp(56), dp(32));', 'new FrameLayout.LayoutParams(dp(20), dp(32));'),
              ('searchModeParams.setMargins(dp(6), 0, 0, 0);', 'searchModeParams.setMargins(dp(4), 0, 0, 0);'),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit('missing compact-control anchor: ' + old)
          path.write_text(text, encoding='utf-8')
          PY
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/build.gradle app/src/main/java/com/jianglab/babywife/MainActivity.java
            git commit -m 'v172: compact search mode control to one-third width [skip ci]'
            git push origin HEAD:agent/v172-compact-search-mode
          fi

      - name: Verify v172 source
        run: |
          set -euo pipefail
          grep -q 'versionCode 2026080872' app/build.gradle
          grep -q 'versionName "2026.08.08.v172-compact-search-mode"' app/build.gradle
          grep -q 'searchInput.setPadding(dp(34), 0, dp(48), 0);' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'searchMatchModeButton.setTextSize(9);' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'new FrameLayout.LayoutParams(dp(20), dp(32));' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'searchModeParams.setMargins(dp(4), 0, 0, 0);' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'final String\[\] modes = {"默认", "歌名", "歌手"};' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q '添加时间↑' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'cacheReplacedPlaylistSongAsync' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'next.setAudioAttributes(audioAttributes, true);' app/src/main/java/com/jianglab/babywife/UnifiedMediaPlayer.java

      - name: Prepare Android toolchain
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64}"
          export PATH="$JAVA_HOME/bin:$PATH"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;37.0.0'
          curl -fL --retry 5 --retry-delay 5 https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle-8.7-bin.zip
          rm -rf /tmp/gradle-8.7
          unzip -q /tmp/gradle-8.7-bin.zip -d /tmp

      - name: Build four unsigned v172 release APKs
        env:
          JIANG_LAB_PASSPHRASE_SHA256: ${{ secrets.JIANG_LAB_PASSPHRASE_SHA256 }}
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64}"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$JAVA_HOME/bin:/tmp/gradle-8.7/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p build
          /tmp/gradle-8.7/bin/gradle --no-daemon assembleRelease 2>&1 | tee build/assemble-v172-release.log

      - name: Align and verify package identities
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          aapt="$ANDROID_HOME/build-tools/37.0.0/aapt"
          zipalign="$ANDROID_HOME/build-tools/37.0.0/zipalign"
          mkdir -p v172-unsigned-aligned signing-tools/lib
          declare -A expected=(
            [babywifeclassic]='com.jianglab.babywife'
            [lidacaizhu]='com.jianglab.babywife.lidacaizhu'
            [jianglab]='com.jianglab.babywife.jianglab'
            [niubi]='com.jianglab.babywife.niubi'
          )
          for flavor in babywifeclassic lidacaizhu jianglab niubi; do
            input="app/build/outputs/apk/${flavor}/release/app-${flavor}-release-unsigned.apk"
            test -s "$input"
            output="v172-unsigned-aligned/${flavor}_v172_unsigned_aligned.apk"
            "$zipalign" -f -p 4 "$input" "$output"
            "$zipalign" -c -p 4 "$output"
            badging=$("$aapt" dump badging "$output")
            package_name=$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            version_code=$(printf '%s\n' "$badging" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")
            test "$package_name" = "${expected[$flavor]}"
            test "$version_code" = '2026080872'
          done
          cp "$ANDROID_HOME/build-tools/37.0.0/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/37.0.0/zipalign" signing-tools/
          cp "$ANDROID_HOME/build-tools/37.0.0/lib/apksigner.jar" signing-tools/lib/
          chmod +x signing-tools/apksigner signing-tools/zipalign
          sha256sum v172-unsigned-aligned/*.apk | tee v172-unsigned-aligned/SHA256.txt
          git rev-parse HEAD | tee v172-unsigned-aligned/SOURCE_HEAD.txt

      - name: Upload v172 artifact
        uses: actions/upload-artifact@v4
        with:
          name: v172-unsigned-aligned-and-signing-tools
          path: |
            v172-unsigned-aligned/
            signing-tools/
            build/assemble-v172-release.log
          if-no-files-found: error
          retention-days: 7
