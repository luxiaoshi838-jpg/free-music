name: Build v128 encrypted M4A release

on:
  push:
    branches:
      - agent/v128-m4a-decrypt
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v128-m4a-decrypt
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Apply cache filename correction
        run: python scripts/apply_v128_cache_filename_patch.py
      - name: Verify requirements
        run: python scripts/check_feature_requirements.py
      - name: Build four release APKs
        run: gradle --no-daemon :app:assembleBabywifeclassicRelease :app:assembleLidacaizhuRelease :app:assembleJianglabRelease :app:assembleNiubiRelease
      - uses: actions/upload-artifact@v4
        with:
          name: v128-four-unsigned-release-apks
          path: app/build/outputs/apk/*/release/*.apk
      - name: Commit formal source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add PROJECT_LOG.md app/src/main/java/com/jianglab/babywife/CacheStorage.java docs/CHANGELOG.md scripts/check_feature_requirements.py
          if ! git diff --cached --quiet; then
            git commit -m 'Fix cache filenames to title and artist [skip ci]'
            git fetch origin agent/v128-m4a-decrypt
            git rebase origin/agent/v128-m4a-decrypt
            git push origin HEAD:agent/v128-m4a-decrypt
          fi
