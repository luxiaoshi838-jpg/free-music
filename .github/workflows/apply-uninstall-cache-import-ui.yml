name: Apply Uninstall Cache Import UI Fix

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uninstall-cache-import-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply verified source patch and broom artwork
        shell: bash
        run: |
          set -euo pipefail
          cat .feature-payload/patch/p*.b64 > /tmp/fix.patch.xz.b64
          base64 -d /tmp/fix.patch.xz.b64 > /tmp/fix.patch.xz
          echo '5ba21592d1f075817ed9a30d2ff876951d45ce308cbbcb2c733aa5a479b58e6a  /tmp/fix.patch.xz' | sha256sum -c -
          xz -dc /tmp/fix.patch.xz > /tmp/fix.patch
          echo '43538256d8fa6059c7be11b93387bb3fc928654420b2da55dc6e18ebc1fff613  /tmp/fix.patch' | sha256sum -c -
          patch -p1 < /tmp/fix.patch
          mkdir -p app/src/main/res/drawable-nodpi
          rm -f app/src/main/res/drawable-nodpi/broom_clean_icon.png
          cp .feature-payload/broom_clean_icon.webp app/src/main/res/drawable-nodpi/broom_clean_icon.webp
          echo '3c4626b8bfec7f9860bc30c266a02c91b7def5e9bb2b72ff626008bfbad233f2  app/src/main/res/drawable-nodpi/broom_clean_icon.webp' | sha256sum -c -
          rm -rf .feature-payload

      - name: Verify source requirements
        run: |
          python3 scripts/check_public_repo.py
          python3 scripts/check_csv_mapping.py
          python3 scripts/check_feature_requirements.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          mkdir -p build
          sdkmanager 'platforms;android-35' 'build-tools;37.0.0' 2>&1 | tee build/sdkmanager.log

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build four APKs
        shell: bash
        run: |
          if [ -f scripts/run_with_no_output_watchdog.py ]; then
            python3 scripts/run_with_no_output_watchdog.py --silence-seconds 300 --log build/assemble-debug.log -- gradle --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug 2>&1 | tee build/assemble-debug.log
          fi

      - name: Show build failure details
        if: failure()
        run: tail -n 260 build/assemble-debug.log || true

      - name: Verify APK package names and signatures
        shell: bash
        run: |
          set -euo pipefail
          aapt="$ANDROID_HOME/build-tools/37.0.0/aapt"
          apksigner="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          declare -A expected=(
            [babywifeclassic]='com.jianglab.babywife'
            [lidacaizhu]='com.jianglab.babywife.lidacaizhu'
            [jianglab]='com.jianglab.babywife.jianglab'
            [niubi]='com.jianglab.babywife.niubi'
          )
          mkdir -p verified-apks
          for flavor in babywifeclassic lidacaizhu jianglab niubi; do
            apk="app/build/outputs/apk/${flavor}/debug/app-${flavor}-debug.apk"
            test -s "$apk"
            package_name=$("$aapt" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            test "$package_name" = "${expected[$flavor]}"
            "$apksigner" verify --verbose "$apk"
            cp "$apk" "verified-apks/${flavor}.apk"
          done
          sha256sum verified-apks/*.apk | tee verified-apks/SHA256.txt

      - name: Commit applied source to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement uninstall cache mode, merged imports and broom artwork'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

      - name: Upload APKs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-brand-uninstall-cache-import-ui-debug-apks
          path: |
            verified-apks/
            build/sdkmanager.log
            build/assemble-debug.log
          if-no-files-found: warn
          retention-days: 14
