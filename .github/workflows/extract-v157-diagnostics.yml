name: Extract v157 Diagnostics

on:
  push:
    branches:
      - agent/v128-m4a-decrypt

permissions:
  contents: write

jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, '[v157-diag-extracted]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v128-m4a-decrypt
          fetch-depth: 0

      - name: Extract relevant methods
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def extract_method(text, marker):
              start = text.find(marker)
              if start < 0:
                  return f'MISSING: {marker}\n'
              brace = text.find('{', start)
              if brace < 0:
                  return f'NO BRACE: {marker}\n'
              depth = 0
              in_string = False
              escape = False
              for i in range(brace, len(text)):
                  ch = text[i]
                  if in_string:
                      if escape:
                          escape = False
                      elif ch == '\\':
                          escape = True
                      elif ch == '"':
                          in_string = False
                      continue
                  if ch == '"':
                      in_string = True
                  elif ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return text[start:i+1] + '\n'
              return f'UNCLOSED: {marker}\n'

          main = Path('app/src/main/java/com/jianglab/babywife/MainActivity.java').read_text(encoding='utf-8')
          search = Path('app/src/main/java/com/jianglab/babywife/SearchQuickPlayback.java').read_text(encoding='utf-8')
          markers = [
              'private void trySearchPlaybackCandidate(',
              'private void cacheSearchPlaybackAsync(',
              'private void addSongToCurrentPlaylist(',
              'private void addSongToCurrentPlaylistReady(',
              'private void playPlaylistSongFromCacheFirst(',
              'private void startLocalPlayback(',
              'private void cancelSearchCacheTask(',
          ]
          out = []
          for marker in markers:
              out.append('\n===== ' + marker + ' =====\n')
              out.append(extract_method(main, marker))
          out.append('\n===== SearchQuickPlayback.resolveStage =====\n')
          out.append(extract_method(search, 'static Candidate resolveStage('))
          Path('docs/v157_diagnostics.txt').write_text(''.join(out), encoding='utf-8')
          PY
          git diff --check

      - name: Commit diagnostics
        run: |
          git config user.name 'luxiaoshi838-jpg'
          git config user.email 'luxiaoshi838@gmail.com'
          git add docs/v157_diagnostics.txt
          git commit -m 'Extract v157 playback diagnostics [v157-diag-extracted] [skip ci]'
          git push origin HEAD:agent/v128-m4a-decrypt
