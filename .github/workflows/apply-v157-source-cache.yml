name: Apply v157 Source and Cache Fixes

on:
  push:
    branches:
      - agent/v128-m4a-decrypt

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v157-applied]') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v128-m4a-decrypt
          fetch-depth: 0

      - name: Apply v157 patch
        run: |
          python3 scripts/apply_v157_source_cache_fix.py
          git diff --check
          grep -q 'versionCode 2026080757' app/build.gradle
          grep -q 'v157-source-faithful-cache-export' app/build.gradle
          grep -q 'media3|catalog|' app/src/main/java/com/jianglab/babywife/Media3CacheStore.java
          grep -q 'trySearchPlaybackCandidate(song, playToken, 0, false)' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q '缓存文件已生成' app/src/main/java/com/jianglab/babywife/MainActivity.java
          ! grep -q '搜索结果、酷我和网易云均没有可播放地址' app/src/main/java/com/jianglab/babywife/MainActivity.java

      - name: Commit source changes
        run: |
          git config user.name 'luxiaoshi838-jpg'
          git config user.email 'luxiaoshi838@gmail.com'
          git add app/src/main/java/com/jianglab/babywife/MainActivity.java \
                  app/src/main/java/com/jianglab/babywife/Media3CacheStore.java \
                  app/src/main/java/com/jianglab/babywife/Media3FriendlyCacheExporter.java \
                  app/build.gradle
          git commit -m 'Fix selected-source playback and friendly cache export [v157-applied] [skip ci]'
          git push origin HEAD:agent/v128-m4a-decrypt
