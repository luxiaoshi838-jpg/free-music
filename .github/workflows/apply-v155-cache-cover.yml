name: Apply v155 Cache and Playlist Cover Fixes

on:
  push:
    branches:
      - agent/v128-m4a-decrypt

permissions:
  contents: write

jobs:
  apply-v155:
    if: ${{ !contains(github.event.head_commit.message, '[v155-cache-cover-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/v128-m4a-decrypt
          fetch-depth: 0

      - name: Apply combined v155 patch
        run: |
          python3 scripts/apply_v155_cache_cover_fix.py
          git diff --check
          grep -q 'Media3PlaybackCacheIndex.record' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'String artworkUrl;' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'object.put("artworkUrl", artworkUrl)' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'Media3PlaybackCacheIndex.summary' app/src/main/java/com/jianglab/babywife/CacheStorage.java
          grep -q 'EXTRA_ARTWORK_URL' app/src/main/java/com/jianglab/babywife/PlaybackControlService.java
          grep -q 'extractArtworkUrl' app/src/main/java/com/jianglab/babywife/PlaybackArtworkLoader.java

      - name: Commit v155 source
        run: |
          if git diff --quiet; then
            echo 'v155 patch already applied.'
            exit 0
          fi
          git config user.name 'luxiaoshi838-jpg'
          git config user.email 'luxiaoshi838@gmail.com'
          git add app/src/main/java/com/jianglab/babywife
          git commit -m 'Fix real playback cache recognition and playlist artwork [v155-cache-cover-applied] [skip ci]'
          git push origin HEAD:agent/v128-m4a-decrypt
