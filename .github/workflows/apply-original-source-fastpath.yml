name: Validate Actual MediaCodec Decode

on:
  push:
    branches:
      - tools/fix-pr9-original-fastpath
    paths:
      - .github/workflows/apply-original-source-fastpath.yml
      - tools/real-decoder-build-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-real-decoder-output
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          ref: tools/fix-pr9-original-fastpath
          fetch-depth: 0

      - name: Checkout current feature source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git checkout fix/multiformat-cache-priority-60s
          echo "target_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 scripts/check_public_repo.py
          python3 scripts/check_feature_requirements.py
          grep -F 'MediaCodec.createByCodecName' app/src/main/java/com/jianglab/babywife/PlaybackCompatibility.java
          grep -F 'outputInfo.size > 0' app/src/main/java/com/jianglab/babywife/PlaybackCompatibility.java
          grep -F 'versionCode 2026080104' app/build.gradle
          git diff --check

      - name: Set up JDK 17
        id: jdk
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        id: android
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        id: sdk
        run: sdkmanager "platforms;android-35" "build-tools;37.0.0"

      - name: Set up Gradle 8.7
        id: gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile four brands
        id: build
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug
          find app/build/outputs/apk -type f -name '*.apk' -print
          test "$(find app/build/outputs/apk -type f -name '*.apk' | wc -l)" -ge 4

      - name: Upload four debug APKs
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: real-mediacodec-validation-apks-${{ github.run_id }}
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error

      - name: Record workflow result
        if: always()
        shell: bash
        run: |
          set +e
          target_sha=$(git rev-parse HEAD 2>/dev/null)
          git reset --hard
          git checkout tools/fix-pr9-original-fastpath
          mkdir -p status
          cat > status/real-mediacodec-validation.txt <<EOF
          job_status=${{ job.status }}
          source=${{ steps.source.outcome }}
          jdk=${{ steps.jdk.outcome }}
          android=${{ steps.android.outcome }}
          sdk=${{ steps.sdk.outcome }}
          gradle=${{ steps.gradle.outcome }}
          build=${{ steps.build.outcome }}
          upload=${{ steps.upload.outcome }}
          target_sha=$target_sha
          artifact_name=real-mediacodec-validation-apks-$GITHUB_RUN_ID
          run_id=$GITHUB_RUN_ID
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/real-mediacodec-validation.txt
          git commit -m "Record real MediaCodec validation result" || true
          git push origin HEAD:tools/fix-pr9-original-fastpath
