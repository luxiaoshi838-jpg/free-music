name: Apply Original Source Fast Path

on:
  push:
    branches:
      - tools/fix-pr9-original-fastpath
    paths:
      - tools/apply_original_source_fastpath_20260801.py
      - .github/workflows/apply-original-source-fastpath.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          ref: tools/fix-pr9-original-fastpath
          fetch-depth: 0

      - name: Apply patch to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git show tools/fix-pr9-original-fastpath:tools/apply_original_source_fastpath_20260801.py > /tmp/apply_fastpath.py
          git checkout fix/multiformat-cache-priority-60s
          cp /tmp/apply_fastpath.py tools/apply_original_source_fastpath_20260801.py
          python3 -m py_compile tools/apply_original_source_fastpath_20260801.py
          python3 tools/apply_original_source_fastpath_20260801.py | tee original-source-fastpath-contract.log
          rm -f tools/apply_original_source_fastpath_20260801.py
          python3 scripts/check_public_repo.py
          python3 scripts/check_feature_requirements.py
          git diff --check
          grep -F '正在使用歌单原来源解析歌曲' app/src/main/java/com/jianglab/babywife/NetworkMediaCache.java
          grep -F '原来源不可用，才开始查找其他平台版本' app/src/main/java/com/jianglab/babywife/NetworkMediaCache.java
          grep -F 'MAX_FALLBACK_ATTEMPTS = 4' app/src/main/java/com/jianglab/babywife/NetworkMediaCache.java
          ! grep -Fq 'findAutomaticChoices' app/src/main/java/com/jianglab/babywife/NetworkMediaCache.java
          ! grep -Fq 'choices.sort' app/src/main/java/com/jianglab/babywife/NetworkMediaCache.java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: sdkmanager "platforms;android-35" "build-tools;37.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile four brands
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug

      - name: Commit source correction to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/jianglab/babywife/NetworkMediaCache.java \
            scripts/check_feature_requirements.py \
            app/build.gradle \
            PROJECT_LOG.md \
            docs/CHANGELOG.md
          git commit -m "Use original song source before cross-platform matching"
          git push origin HEAD:fix/multiformat-cache-priority-60s
