name: Apply Original Source Fast Path

on:
  push:
    branches:
      - tools/fix-pr9-original-fastpath
    paths:
      - tools/apply_original_source_fastpath_20260801.py
      - .github/workflows/apply-original-source-fastpath.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-original-source-fastpath
  cancel-in-progress: true

jobs:
  patch-build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          ref: tools/fix-pr9-original-fastpath
          fetch-depth: 0

      - name: Apply patch to PR branch
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          git show tools/fix-pr9-original-fastpath:tools/apply_original_source_fastpath_20260801.py > /tmp/apply_fastpath.py
          git checkout fix/multiformat-cache-priority-60s
          mkdir -p tools
          cp /tmp/apply_fastpath.py tools/apply_original_source_fastpath_20260801.py
          python3 -m py_compile tools/apply_original_source_fastpath_20260801.py
          python3 tools/apply_original_source_fastpath_20260801.py | tee original-source-fastpath-contract.log
          rm -f tools/apply_original_source_fastpath_20260801.py
          python3 scripts/check_public_repo.py
          python3 scripts/check_feature_requirements.py
          git diff --check
          grep -F '正在使用歌单原来源解析歌曲' app/src/main/java/com/jianglab/babywife/NetworkMediaCache.java
          grep -F '原来源不可用，才开始查找其他平台版本' app/src/main/java/com/jianglab/babywife/NetworkMediaCache.java
          grep -F 'MAX_FALLBACK_ATTEMPTS = 4' app/src/main/java/com/jianglab/babywife/NetworkMediaCache.java
          ! grep -Fq 'findAutomaticChoices' app/src/main/java/com/jianglab/babywife/NetworkMediaCache.java
          ! grep -Fq 'choices.sort' app/src/main/java/com/jianglab/babywife/NetworkMediaCache.java

      - name: Set up JDK 17
        id: jdk
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        id: android
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        id: sdk
        run: sdkmanager "platforms;android-35" "build-tools;37.0.0"

      - name: Set up Gradle 8.7
        id: gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile four brands
        id: build
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug

      - name: Commit source correction to PR branch
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/jianglab/babywife/NetworkMediaCache.java \
            scripts/check_feature_requirements.py \
            app/build.gradle \
            PROJECT_LOG.md \
            docs/CHANGELOG.md
          git commit -m "Use original song source before cross-platform matching"
          target_sha=$(git rev-parse HEAD)
          git push origin HEAD:fix/multiformat-cache-priority-60s
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Record workflow result
        if: always()
        shell: bash
        run: |
          set +e
          git reset --hard
          git checkout tools/fix-pr9-original-fastpath
          mkdir -p status
          cat > status/original-source-fastpath.txt <<EOF
          job_status=${{ job.status }}
          apply=${{ steps.apply.outcome }}
          jdk=${{ steps.jdk.outcome }}
          android=${{ steps.android.outcome }}
          sdk=${{ steps.sdk.outcome }}
          gradle=${{ steps.gradle.outcome }}
          build=${{ steps.build.outcome }}
          publish=${{ steps.publish.outcome }}
          target_sha=${{ steps.publish.outputs.target_sha }}
          run_id=$GITHUB_RUN_ID
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/original-source-fastpath.txt
          git commit -m "Record original-source fast-path workflow result" || true
          git push origin HEAD:tools/fix-pr9-original-fastpath
