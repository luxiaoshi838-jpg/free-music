name: Append v153 Logs

on:
  push:
    branches:
      - agent/v128-m4a-decrypt

permissions:
  contents: write

jobs:
  append-logs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/v128-m4a-decrypt
          fetch-depth: 0

      - name: Append logs
        run: |
          python3 scripts/append_v153_logs.py
          grep -q 'v153 playlist playback-stop diagnosis and reporting' PROJECT_LOG.md
          grep -q '## v153 - 2026-08-06' docs/CHANGELOG.md
          git diff --check

      - name: Commit logs
        run: |
          if git diff --quiet; then
            echo 'v153 logs already present.'
            exit 0
          fi
          git config user.name 'luxiaoshi838-jpg'
          git config user.email 'luxiaoshi838@gmail.com'
          git add PROJECT_LOG.md docs/CHANGELOG.md
          git commit -m 'Document v153 playback stop work [skip ci]'
          git push origin HEAD:agent/v128-m4a-decrypt
