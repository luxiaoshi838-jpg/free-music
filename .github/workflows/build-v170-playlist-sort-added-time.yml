name: Build v170 Playlist Sort Added Time

on:
  push:
    branches: [agent/v170-playlist-sort-added-time]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout v170 branch
        uses: actions/checkout@v4
        with:
          ref: agent/v170-playlist-sort-added-time
          fetch-depth: 0

      - name: Apply v170 playlist sorting patch
        run: |
          set -euo pipefail
          python3 scripts/apply_v170_playlist_sort_added_time.py
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/build.gradle app/src/main/java/com/jianglab/babywife/MainActivity.java
            git commit -m 'v170: add playlist add-time sorting and Latin-first order [skip ci]'
            git push origin HEAD:agent/v170-playlist-sort-added-time
          fi

      - name: Verify v170 source
        run: |
          set -euo pipefail
          grep -q 'versionCode 2026080870' app/build.gradle
          grep -q 'versionName "2026.08.08.v170-playlist-sort-added-time"' app/build.gradle
          grep -q '"添加时间↑", "添加时间↓"' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'long addedAt;' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'object.put("addedAt", addedAt);' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'stampImportedPlaylistBatch(imported);' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'script == Character.UnicodeScript.LATIN' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'script == Character.UnicodeScript.HAN' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'Same import batch/same timestamp: always name ascending.' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'cacheReplacedPlaylistSongAsync' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'next.setAudioAttributes(audioAttributes, true);' app/src/main/java/com/jianglab/babywife/UnifiedMediaPlayer.java

      - name: Prepare Android toolchain
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64}"
          export PATH="$JAVA_HOME/bin:$PATH"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;37.0.0'
          curl -fL --retry 5 --retry-delay 5 https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle-8.7-bin.zip
          rm -rf /tmp/gradle-8.7
          unzip -q /tmp/gradle-8.7-bin.zip -d /tmp

      - name: Build four unsigned v170 release APKs
        env:
          JIANG_LAB_PASSPHRASE_SHA256: ${{ secrets.JIANG_LAB_PASSPHRASE_SHA256 }}
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64}"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$JAVA_HOME/bin:/tmp/gradle-8.7/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p build
          /tmp/gradle-8.7/bin/gradle --no-daemon assembleRelease 2>&1 | tee build/assemble-v170-release.log

      - name: Align and verify package identities
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          aapt="$ANDROID_HOME/build-tools/37.0.0/aapt"
          zipalign="$ANDROID_HOME/build-tools/37.0.0/zipalign"
          mkdir -p v170-unsigned-aligned signing-tools/lib
          declare -A expected=(
            [babywifeclassic]='com.jianglab.babywife'
            [lidacaizhu]='com.jianglab.babywife.lidacaizhu'
            [jianglab]='com.jianglab.babywife.jianglab'
            [niubi]='com.jianglab.babywife.niubi'
          )
          for flavor in babywifeclassic lidacaizhu jianglab niubi; do
            input="app/build/outputs/apk/${flavor}/release/app-${flavor}-release-unsigned.apk"
            test -s "$input"
            output="v170-unsigned-aligned/${flavor}_v170_unsigned_aligned.apk"
            "$zipalign" -f -p 4 "$input" "$output"
            "$zipalign" -c -p 4 "$output"
            badging=$("$aapt" dump badging "$output")
            package_name=$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            version_code=$(printf '%s\n' "$badging" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")
            test "$package_name" = "${expected[$flavor]}"
            test "$version_code" = '2026080870'
          done
          cp "$ANDROID_HOME/build-tools/37.0.0/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/37.0.0/zipalign" signing-tools/
          cp "$ANDROID_HOME/build-tools/37.0.0/lib/apksigner.jar" signing-tools/lib/
          chmod +x signing-tools/apksigner signing-tools/zipalign
          sha256sum v170-unsigned-aligned/*.apk | tee v170-unsigned-aligned/SHA256.txt
          git rev-parse HEAD | tee v170-unsigned-aligned/SOURCE_HEAD.txt

      - name: Upload unsigned APKs and signing tools
        uses: actions/upload-artifact@v4
        with:
          name: v170-unsigned-aligned-and-signing-tools
          path: |
            v170-unsigned-aligned/
            signing-tools/
            build/assemble-v170-release.log
          if-no-files-found: error
          retention-days: 7
