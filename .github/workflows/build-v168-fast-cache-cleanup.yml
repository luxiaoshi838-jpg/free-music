name: Build v168 Fast Cache Cleanup

on:
  push:
    branches: [agent/v168-fast-transient-cache-cleanup]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-or-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout v168 branch
        uses: actions/checkout@v4
        with:
          ref: agent/v168-fast-transient-cache-cleanup
          fetch-depth: 0

      - name: Apply v168 fast cleanup patch
        id: patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('app/build.gradle')
          text = gradle.read_text(encoding='utf-8')
          text = text.replace('versionCode 2026080867', 'versionCode 2026080868')
          text = text.replace('versionName "2026.08.08.v167-cache-anr-keyboard-transition"', 'versionName "2026.08.08.v168-fast-transient-cache-cleanup"')
          gradle.write_text(text, encoding='utf-8')

          main = Path('app/src/main/java/com/jianglab/babywife/MainActivity.java')
          text = main.read_text(encoding='utf-8')
          old = '''                    String media3Key = Media3CacheStore.keyFor(song.title, song.artist, song.catalogJson);\n                    String friendlyUri = cacheKey.isEmpty() ? "" : CacheStorage.findAudioUri(this, cacheKey);\n                    if (friendlyUri.isEmpty() && !media3Key.isEmpty()) {\n                        friendlyUri = Media3PlaybackCacheIndex.friendlyUri(this, media3Key);\n                    }\n                    boolean hasFriendly = !friendlyUri.isEmpty() && CacheFileState.exists(this, friendlyUri);\n                    if (!media3Key.isEmpty() && !hasFriendly) keepMedia3Keys.add(media3Key);'''
          new = '''                    String media3Key = Media3CacheStore.keyFor(\n                        song.title, song.artist, song.catalogJson);\n                    // Fast cleanup: playlist membership itself is the retention rule.\n                    // Do not touch disk here to verify friendly files one by one.\n                    if (!media3Key.isEmpty()) keepMedia3Keys.add(media3Key);'''
          if old not in text and new not in text:
              raise SystemExit('v167 slow cleanup block not found')
          text = text.replace(old, new, 1)
          main.write_text(text, encoding='utf-8')
          PY

          if git diff --quiet; then
            echo 'patched=false' >> "$GITHUB_OUTPUT"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/build.gradle app/src/main/java/com/jianglab/babywife/MainActivity.java
            git commit -m 'v168: speed up non-playlist cache cleanup without UI blocking'
            git push origin HEAD:agent/v168-fast-transient-cache-cleanup
            echo 'patched=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Stop first pass after source commit
        if: steps.patch.outputs.patched == 'true'
        run: echo 'v168 source committed; next push run will build.'

      - name: Verify v168 source
        if: steps.patch.outputs.patched != 'true'
        run: |
          set -euo pipefail
          grep -q 'versionCode 2026080868' app/build.gradle
          grep -q 'versionName "2026.08.08.v168-fast-transient-cache-cleanup"' app/build.gradle
          grep -q 'Fast cleanup: playlist membership itself is the retention rule.' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'if (!media3Key.isEmpty()) keepMedia3Keys.add(media3Key);' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'transient-cache-cleaner' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'hideKeyboardAndClearFocus(null);' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'next.setAudioAttributes(audioAttributes, true);' app/src/main/java/com/jianglab/babywife/UnifiedMediaPlayer.java

      - name: Prepare Android toolchain
        if: steps.patch.outputs.patched != 'true'
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64}"
          export PATH="$JAVA_HOME/bin:$PATH"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;37.0.0'
          curl -fL --retry 5 --retry-delay 5 https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle-8.7-bin.zip
          rm -rf /tmp/gradle-8.7
          unzip -q /tmp/gradle-8.7-bin.zip -d /tmp

      - name: Build four unsigned v168 release APKs
        if: steps.patch.outputs.patched != 'true'
        env:
          JIANG_LAB_PASSPHRASE_SHA256: ${{ secrets.JIANG_LAB_PASSPHRASE_SHA256 }}
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64}"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$JAVA_HOME/bin:/tmp/gradle-8.7/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p build
          /tmp/gradle-8.7/bin/gradle --no-daemon assembleRelease 2>&1 | tee build/assemble-v168-release.log

      - name: Align and verify package identities
        if: steps.patch.outputs.patched != 'true'
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          aapt="$ANDROID_HOME/build-tools/37.0.0/aapt"
          zipalign="$ANDROID_HOME/build-tools/37.0.0/zipalign"
          mkdir -p v168-unsigned-aligned signing-tools/lib
          declare -A expected=(
            [babywifeclassic]='com.jianglab.babywife'
            [lidacaizhu]='com.jianglab.babywife.lidacaizhu'
            [jianglab]='com.jianglab.babywife.jianglab'
            [niubi]='com.jianglab.babywife.niubi'
          )
          for flavor in babywifeclassic lidacaizhu jianglab niubi; do
            input="app/build/outputs/apk/${flavor}/release/app-${flavor}-release-unsigned.apk"
            test -s "$input"
            output="v168-unsigned-aligned/${flavor}_v168_unsigned_aligned.apk"
            "$zipalign" -f -p 4 "$input" "$output"
            "$zipalign" -c -p 4 "$output"
            badging=$("$aapt" dump badging "$output")
            package_name=$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            version_code=$(printf '%s\n' "$badging" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")
            test "$package_name" = "${expected[$flavor]}"
            test "$version_code" = '2026080868'
          done
          cp "$ANDROID_HOME/build-tools/37.0.0/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/37.0.0/zipalign" signing-tools/
          cp "$ANDROID_HOME/build-tools/37.0.0/lib/apksigner.jar" signing-tools/lib/
          chmod +x signing-tools/apksigner signing-tools/zipalign
          sha256sum v168-unsigned-aligned/*.apk | tee v168-unsigned-aligned/SHA256.txt
          git rev-parse HEAD | tee v168-unsigned-aligned/SOURCE_HEAD.txt

      - name: Upload unsigned APKs and signing tools
        if: steps.patch.outputs.patched != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: v168-unsigned-aligned-and-signing-tools
          path: |
            v168-unsigned-aligned/
            signing-tools/
            build/assemble-v168-release.log
          if-no-files-found: error
          retention-days: 7
