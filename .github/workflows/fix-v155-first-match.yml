name: Fix v155 First Match

on:
  push:
    branches:
      - agent/v128-m4a-decrypt

permissions:
  contents: write

jobs:
  fix-first-match:
    if: ${{ !contains(github.event.head_commit.message, '[v155-first-match-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v128-m4a-decrypt
          fetch-depth: 0

      - name: Allow first playback match only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_v155_cache_cover_fix.py')
          text = path.read_text(encoding='utf-8')
          old = '''def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1, found {count}')
              return text.replace(old, new, 1)
          '''.replace('              ', '    ')
          new = '''def replace_once(text, old, new, label):
              count = text.count(old)
              if label == 'record playback cache' and count >= 1:
                  return text.replace(old, new, 1)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1, found {count}')
              return text.replace(old, new, 1)
          '''.replace('              ', '    ')
          if text.count(old) != 1:
              raise SystemExit(f'helper block match count={text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Commit helper fix
        run: |
          git config user.name 'luxiaoshi838-jpg'
          git config user.email 'luxiaoshi838@gmail.com'
          git add scripts/apply_v155_cache_cover_fix.py
          git commit -m 'Fix v155 first-match behavior [v155-first-match-fixed] [skip ci]'
          git push origin HEAD:agent/v128-m4a-decrypt
