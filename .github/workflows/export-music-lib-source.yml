name: Export music-lib source

on:
  push:
    branches:
      - agent/v128-m4a-decrypt

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Download dependency source
        run: |
          set -euo pipefail
          mkdir -p export
          go mod download -json github.com/guohuiyuan/music-lib@v1.1.0 > export/module.json
          MODDIR=$(go env GOPATH)/pkg/mod/github.com/guohuiyuan/music-lib@v1.1.0
          cp -R "$MODDIR" export/music-lib
      - uses: actions/upload-artifact@v4
        with:
          name: music-lib-v1.1.0-source
          path: export
