name: Build v138 restore search add playlist

on:
  push:
    branches:
      - agent/v128-m4a-decrypt

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v128-m4a-decrypt
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Apply v138 patch when needed
        run: |
          if grep -q 'versionCode 2026080138' app/build.gradle; then
            echo 'v138 source already present'
          else
            python scripts/apply_v138_restore_search_add_playlist_patch.py
          fi
      - name: Verify feature requirements
        run: python scripts/check_feature_requirements.py
      - name: Assert search add-to-playlist action
        run: |
          python - <<'PY'
          from pathlib import Path
          main = Path('app/src/main/java/com/jianglab/babywife/MainActivity.java').read_text(encoding='utf-8')
          required = [
              'boolean fromSearch = song != null && playingSearchQueue;',
              'addCurrentButton.setText("加入当前歌单");',
              'addCurrentButton.setVisibility(fromSearch ? View.VISIBLE : View.GONE);',
              'searchResultsList.setOnItemLongClickListener',
          ]
          missing = [item for item in required if item not in main]
          if missing:
              raise SystemExit('Missing search playlist action: ' + ', '.join(missing))
          if 'fromSearchOnly' in main:
              raise SystemExit('Obsolete hidden search action condition remains')
          print('Search add-to-playlist action is visible for every search context')
          PY
      - name: Build four release APKs
        run: gradle --no-daemon :app:assembleBabywifeclassicRelease :app:assembleLidacaizhuRelease :app:assembleJianglabRelease :app:assembleNiubiRelease
      - uses: actions/upload-artifact@v4
        with:
          name: v138-four-unsigned-release-apks
          path: app/build/outputs/apk/*/release/*.apk
      - name: Commit formal source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add PROJECT_LOG.md app/build.gradle app/src/main/java/com/jianglab/babywife/MainActivity.java docs/CHANGELOG.md scripts/check_feature_requirements.py
          if ! git diff --cached --quiet; then
            git commit -m 'Restore search add-to-playlist action [skip ci]'
            git fetch origin agent/v128-m4a-decrypt
            git rebase origin/agent/v128-m4a-decrypt
            git push origin HEAD:agent/v128-m4a-decrypt
          fi
