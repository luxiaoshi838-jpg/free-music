name: Build v165 Audio Focus

on:
  push:
    branches:
      - agent/v165-audio-focus
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-or-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout v165 branch
        uses: actions/checkout@v4
        with:
          ref: agent/v165-audio-focus
          fetch-depth: 0

      - name: Apply v165 audio focus patch
        id: patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('app/build.gradle')
          text = gradle.read_text(encoding='utf-8')
          text = text.replace('versionCode 2026080764', 'versionCode 2026080865')
          text = text.replace('versionName "2026.08.07.v164-clean-media-baseline"', 'versionName "2026.08.08.v165-audio-focus"')
          gradle.write_text(text, encoding='utf-8')

          player = Path('app/src/main/java/com/jianglab/babywife/UnifiedMediaPlayer.java')
          text = player.read_text(encoding='utf-8')
          if 'import androidx.media3.common.AudioAttributes;' not in text:
              text = text.replace('import androidx.media3.common.C;\n', 'import androidx.media3.common.AudioAttributes;\nimport androidx.media3.common.C;\n')

          old = '''            ExoPlayer next = new ExoPlayer.Builder(appContext)\n                .setLooper(Looper.getMainLooper())\n                .build();\n            next.setWakeMode(C.WAKE_MODE_NETWORK);'''
          new = '''            ExoPlayer next = new ExoPlayer.Builder(appContext)\n                .setLooper(Looper.getMainLooper())\n                .build();\n            AudioAttributes audioAttributes = new AudioAttributes.Builder()\n                .setUsage(C.USAGE_MEDIA)\n                .setContentType(C.AUDIO_CONTENT_TYPE_MUSIC)\n                .build();\n            // Let Media3 request and manage Android audio focus. If another app\n            // starts video/music/call audio, playback pauses or ducks as Android\n            // requests; transient focus gain resumes only when playWhenReady is\n            // still true, so a user-initiated pause is never auto-resumed.\n            next.setAudioAttributes(audioAttributes, true);\n            next.setWakeMode(C.WAKE_MODE_NETWORK);'''
          if old not in text and 'next.setAudioAttributes(audioAttributes, true);' not in text:
              raise SystemExit('Expected ExoPlayer creation block not found')
          text = text.replace(old, new)
          player.write_text(text, encoding='utf-8')
          PY

          if git diff --quiet; then
            echo "patched=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/build.gradle app/src/main/java/com/jianglab/babywife/UnifiedMediaPlayer.java
            git commit -m "v165: add standard Android audio focus handling"
            git push origin HEAD:agent/v165-audio-focus
            echo "patched=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop first pass after source commit
        if: steps.patch.outputs.patched == 'true'
        run: echo "v165 source committed; next push-triggered run will build."

      - name: Verify v165 source and stable baseline
        if: steps.patch.outputs.patched != 'true'
        run: |
          set -euo pipefail
          grep -q 'versionCode 2026080865' app/build.gradle
          grep -q 'versionName "2026.08.08.v165-audio-focus"' app/build.gradle
          grep -q 'import androidx.media3.common.AudioAttributes;' app/src/main/java/com/jianglab/babywife/UnifiedMediaPlayer.java
          grep -q 'setUsage(C.USAGE_MEDIA)' app/src/main/java/com/jianglab/babywife/UnifiedMediaPlayer.java
          grep -q 'setContentType(C.AUDIO_CONTENT_TYPE_MUSIC)' app/src/main/java/com/jianglab/babywife/UnifiedMediaPlayer.java
          grep -q 'next.setAudioAttributes(audioAttributes, true);' app/src/main/java/com/jianglab/babywife/UnifiedMediaPlayer.java
          git show v159-ci-31142430060:app/src/main/java/com/jianglab/babywife/PlaybackControlService.java > /tmp/v159-service.java
          git show v159-ci-31142430060:app/src/main/java/com/jianglab/babywife/PlaybackArtworkLoader.java > /tmp/v159-artwork.java
          cmp -s /tmp/v159-service.java app/src/main/java/com/jianglab/babywife/PlaybackControlService.java
          cmp -s /tmp/v159-artwork.java app/src/main/java/com/jianglab/babywife/PlaybackArtworkLoader.java
          ! grep -q 'playlistCacheButton.setText("正在检查缓存状态' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'if (songHasRecordedCache(song)) continue;' app/src/main/java/com/jianglab/babywife/MainActivity.java

      - name: Prepare Android toolchain
        if: steps.patch.outputs.patched != 'true'
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64}"
          export PATH="$JAVA_HOME/bin:$PATH"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;37.0.0"
          curl -fL --retry 5 --retry-delay 5 https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle-8.7-bin.zip
          rm -rf /tmp/gradle-8.7
          unzip -q /tmp/gradle-8.7-bin.zip -d /tmp

      - name: Build four unsigned v165 release APKs
        if: steps.patch.outputs.patched != 'true'
        env:
          JIANG_LAB_PASSPHRASE_SHA256: ${{ secrets.JIANG_LAB_PASSPHRASE_SHA256 }}
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64}"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$JAVA_HOME/bin:/tmp/gradle-8.7/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p build
          /tmp/gradle-8.7/bin/gradle --no-daemon assembleRelease 2>&1 | tee build/assemble-v165-release.log

      - name: Align and verify package identities
        if: steps.patch.outputs.patched != 'true'
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          aapt="$ANDROID_HOME/build-tools/37.0.0/aapt"
          zipalign="$ANDROID_HOME/build-tools/37.0.0/zipalign"
          mkdir -p v165-unsigned-aligned signing-tools/lib
          declare -A expected=(
            [babywifeclassic]="com.jianglab.babywife"
            [lidacaizhu]="com.jianglab.babywife.lidacaizhu"
            [jianglab]="com.jianglab.babywife.jianglab"
            [niubi]="com.jianglab.babywife.niubi"
          )
          for flavor in babywifeclassic lidacaizhu jianglab niubi; do
            input="app/build/outputs/apk/${flavor}/release/app-${flavor}-release-unsigned.apk"
            test -s "$input"
            output="v165-unsigned-aligned/${flavor}_v165_unsigned_aligned.apk"
            "$zipalign" -f -p 4 "$input" "$output"
            "$zipalign" -c -p 4 "$output"
            badging=$("$aapt" dump badging "$output")
            package_name=$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            version_code=$(printf '%s\n' "$badging" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")
            test "$package_name" = "${expected[$flavor]}"
            test "$version_code" = "2026080865"
          done
          cp "$ANDROID_HOME/build-tools/37.0.0/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/37.0.0/zipalign" signing-tools/
          cp "$ANDROID_HOME/build-tools/37.0.0/lib/apksigner.jar" signing-tools/lib/
          chmod +x signing-tools/apksigner signing-tools/zipalign
          sha256sum v165-unsigned-aligned/*.apk | tee v165-unsigned-aligned/SHA256.txt
          git rev-parse HEAD | tee v165-unsigned-aligned/SOURCE_HEAD.txt

      - name: Upload unsigned APKs and signing tools
        if: steps.patch.outputs.patched != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: v165-unsigned-aligned-and-signing-tools
          path: |
            v165-unsigned-aligned/
            signing-tools/
            build/assemble-v165-release.log
          if-no-files-found: error
          retention-days: 7
