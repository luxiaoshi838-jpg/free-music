name: Build v126 once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-v126-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;37.0.0'
      - name: Verify source
        run: |
          python scripts/check_public_repo.py
          python scripts/check_feature_requirements.py
          grep -q 'versionCode 2026080126' app/build.gradle
          grep -q 'private void refreshCachedUrisAfterMigrationAsync()' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q '"cache-uri-refresh"' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'attachSubtlePressFeedback(previous);' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'attachSubtlePressFeedback(next);' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'clearSearchButton.setText("×")' app/src/main/java/com/jianglab/babywife/MainActivity.java
      - name: Build four brands
        run: |
          chmod +x gradlew
          sed -i 's/^networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          ./gradlew --no-daemon :app:assembleDebug
      - name: Verify APKs
        run: |
          find app/build/outputs/apk -type f -name '*.apk' -print
          test "$(find app/build/outputs/apk -type f -name '*.apk' | wc -l)" -ge 4
      - uses: actions/upload-artifact@v4
        with:
          name: cache-io-guard-ui-feedback-v126-apks-${{ github.run_id }}
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
      - name: Record result
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p build-status
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "artifact_name=cache-io-guard-ui-feedback-v126-apks-${GITHUB_RUN_ID}"
            echo "source_commit=921a3dbc32a3513d521eb7f5f7f968f0739df69c"
            echo "job_status=${{ job.status }}"
          } > build-status/v126-main.txt
          git add build-status/v126-main.txt
          git commit -m "Record v126 one-time APK build ${GITHUB_RUN_ID}" || true
          git push origin HEAD:main
