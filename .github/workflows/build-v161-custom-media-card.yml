name: Build v161 Custom Dark Media Card

on:
  push:
    branches:
      - agent/v161-custom-dark-media-card
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-or-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout v161 branch
        uses: actions/checkout@v4
        with:
          ref: agent/v161-custom-dark-media-card
          fetch-depth: 0

      - name: Apply v161 patch and persist source
        id: patch
        run: |
          set -euo pipefail
          python3 scripts/apply_v161_custom_media_card.py
          if git diff --quiet; then
            echo "patched=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              app/build.gradle \
              app/src/main/java/com/jianglab/babywife/PlaybackControlService.java \
              app/src/main/res/layout/notification_media_compact.xml \
              app/src/main/res/layout/notification_media_expanded.xml \
              PROJECT_LOG.md
            git commit -m "v161: force custom dark lockscreen media card"
            git push origin HEAD:agent/v161-custom-dark-media-card
            echo "patched=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop first pass after source commit
        if: steps.patch.outputs.patched == 'true'
        run: echo "Persisted v161 source; push-triggered run will build it."

      - name: Verify v161 source
        if: steps.patch.outputs.patched != 'true'
        run: |
          set -euo pipefail
          grep -q 'versionCode 2026080761' app/build.gradle
          grep -q 'versionName "2026.08.07.v161-custom-dark-media-card"' app/build.gradle
          grep -q 'R.layout.notification_media_compact' app/src/main/java/com/jianglab/babywife/PlaybackControlService.java
          grep -q 'R.layout.notification_media_expanded' app/src/main/java/com/jianglab/babywife/PlaybackControlService.java
          grep -q 'DecoratedCustomViewStyle' app/src/main/java/com/jianglab/babywife/PlaybackControlService.java
          ! grep -q 'new Notification.MediaStyle()' app/src/main/java/com/jianglab/babywife/PlaybackControlService.java
          test -s app/src/main/res/layout/notification_media_compact.xml
          test -s app/src/main/res/layout/notification_media_expanded.xml

      - name: Prepare Android toolchain
        if: steps.patch.outputs.patched != 'true'
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64}"
          export PATH="$JAVA_HOME/bin:$PATH"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;37.0.0"
          curl -fL --retry 5 --retry-delay 5 https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle-8.7-bin.zip
          rm -rf /tmp/gradle-8.7
          unzip -q /tmp/gradle-8.7-bin.zip -d /tmp

      - name: Build four unsigned v161 release APKs
        if: steps.patch.outputs.patched != 'true'
        env:
          JIANG_LAB_PASSPHRASE_SHA256: ${{ secrets.JIANG_LAB_PASSPHRASE_SHA256 }}
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64}"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$JAVA_HOME/bin:/tmp/gradle-8.7/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p build
          /tmp/gradle-8.7/bin/gradle --no-daemon assembleRelease 2>&1 | tee build/assemble-v161-release.log

      - name: Align and verify package identities
        if: steps.patch.outputs.patched != 'true'
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          aapt="$ANDROID_HOME/build-tools/37.0.0/aapt"
          zipalign="$ANDROID_HOME/build-tools/37.0.0/zipalign"
          mkdir -p v161-unsigned-aligned signing-tools/lib
          declare -A expected=(
            [babywifeclassic]="com.jianglab.babywife"
            [lidacaizhu]="com.jianglab.babywife.lidacaizhu"
            [jianglab]="com.jianglab.babywife.jianglab"
            [niubi]="com.jianglab.babywife.niubi"
          )
          for flavor in babywifeclassic lidacaizhu jianglab niubi; do
            input="app/build/outputs/apk/${flavor}/release/app-${flavor}-release-unsigned.apk"
            test -s "$input"
            output="v161-unsigned-aligned/${flavor}_v161_unsigned_aligned.apk"
            "$zipalign" -f -p 4 "$input" "$output"
            "$zipalign" -c -p 4 "$output"
            badging=$("$aapt" dump badging "$output")
            package_name=$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            version_code=$(printf '%s\n' "$badging" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")
            test "$package_name" = "${expected[$flavor]}"
            test "$version_code" = "2026080761"
          done
          cp "$ANDROID_HOME/build-tools/37.0.0/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/37.0.0/zipalign" signing-tools/
          cp "$ANDROID_HOME/build-tools/37.0.0/lib/apksigner.jar" signing-tools/lib/
          chmod +x signing-tools/apksigner signing-tools/zipalign
          sha256sum v161-unsigned-aligned/*.apk | tee v161-unsigned-aligned/SHA256.txt
          git rev-parse HEAD | tee v161-unsigned-aligned/SOURCE_HEAD.txt

      - name: Upload unsigned APKs and signing tools
        if: steps.patch.outputs.patched != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: v161-unsigned-aligned-and-signing-tools
          path: |
            v161-unsigned-aligned/
            signing-tools/
            build/assemble-v161-release.log
          if-no-files-found: error
          retention-days: 7
