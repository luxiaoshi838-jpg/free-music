name: Build v175 Playback Cache Format Crashlog

on:
  push:
    branches: [agent/v175-playback-cache-format-crashlog]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/v175-playback-cache-format-crashlog
          fetch-depth: 0

      - name: Apply v175 patch
        run: |
          set -euo pipefail
          python3 scripts/apply_v175_playback_cache_format_crashlog.py
          python3 scripts/apply_v175_shared_cache_task_state.py
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/build.gradle app/src/main/java/com/jianglab/babywife/MainActivity.java app/src/main/java/com/jianglab/babywife/NetworkMediaCache.java app/src/main/java/com/jianglab/babywife/PlayableAudioResolver.java
            git commit -m 'v175: unify cache task state and playable-format handling [skip ci]'
            git push origin HEAD:agent/v175-playback-cache-format-crashlog
          fi

      - name: Verify source
        run: |
          set -euo pipefail
          grep -q 'versionCode 2026080875' app/build.gradle
          grep -q 'versionName "2026.08.08.v175-playback-cache-format-crashlog"' app/build.gradle
          grep -q 'activeSongCacheKeys = ConcurrentHashMap.newKeySet();' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q '该歌曲已有缓存任务，直接复用现有任务' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q '复用已有任务' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'NetworkMediaCache.CacheResult cached = NetworkMediaCache.cache' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'storeProblemReportSync(report.toString());' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'putString(KEY_PROBLEM_REPORT_HISTORY, next.toString())' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'searchMatchModeButton.setGravity(Gravity.CENTER_HORIZONTAL | Gravity.CENTER_VERTICAL);' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'MAX_PROBLEM_REPORT_HISTORY = 10' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'private static final String\[\] REQUEST_FORMATS = {""};' app/src/main/java/com/jianglab/babywife/PlayableAudioResolver.java
          grep -q 'no format priority' app/src/main/java/com/jianglab/babywife/PlayableAudioResolver.java
          ! grep -A12 'private static JSONObject resolve(String catalogJson)' app/src/main/java/com/jianglab/babywife/NetworkMediaCache.java | grep -q 'request.put("format", "mp3")'
          grep -q 'AudioPlaybackVerifier.Probe probe = AudioPlaybackVerifier.probeFile' app/src/main/java/com/jianglab/babywife/PlayableAudioResolver.java
          grep -q 'next.setAudioAttributes(audioAttributes, true);' app/src/main/java/com/jianglab/babywife/UnifiedMediaPlayer.java

      - name: Prepare Android toolchain
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64}"
          export PATH="$JAVA_HOME/bin:$PATH"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;37.0.0'
          curl -fL --retry 5 --retry-delay 5 https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle-8.7-bin.zip
          rm -rf /tmp/gradle-8.7
          unzip -q /tmp/gradle-8.7-bin.zip -d /tmp

      - name: Build four unsigned releases
        env:
          JIANG_LAB_PASSPHRASE_SHA256: ${{ secrets.JIANG_LAB_PASSPHRASE_SHA256 }}
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64}"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$JAVA_HOME/bin:/tmp/gradle-8.7/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p build
          /tmp/gradle-8.7/bin/gradle --no-daemon assembleRelease 2>&1 | tee build/assemble-v175-release.log

      - name: Align and verify APKs
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          aapt="$ANDROID_HOME/build-tools/37.0.0/aapt"
          zipalign="$ANDROID_HOME/build-tools/37.0.0/zipalign"
          mkdir -p v175-unsigned-aligned signing-tools/lib
          declare -A expected
          expected[babywifeclassic]='com.jianglab.babywife'
          expected[lidacaizhu]='com.jianglab.babywife.lidacaizhu'
          expected[jianglab]='com.jianglab.babywife.jianglab'
          expected[niubi]='com.jianglab.babywife.niubi'
          for flavor in babywifeclassic lidacaizhu jianglab niubi; do
            input="app/build/outputs/apk/${flavor}/release/app-${flavor}-release-unsigned.apk"
            output="v175-unsigned-aligned/${flavor}_v175_unsigned_aligned.apk"
            test -s "$input"
            "$zipalign" -f -p 4 "$input" "$output"
            "$zipalign" -c -p 4 "$output"
            badging=$("$aapt" dump badging "$output")
            package_name=$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            version_code=$(printf '%s\n' "$badging" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")
            test "$package_name" = "${expected[$flavor]}"
            test "$version_code" = '2026080875'
          done
          cp "$ANDROID_HOME/build-tools/37.0.0/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/37.0.0/zipalign" signing-tools/
          cp "$ANDROID_HOME/build-tools/37.0.0/lib/apksigner.jar" signing-tools/lib/
          chmod +x signing-tools/apksigner signing-tools/zipalign
          sha256sum v175-unsigned-aligned/*.apk > v175-unsigned-aligned/SHA256.txt
          git rev-parse HEAD > v175-unsigned-aligned/SOURCE_HEAD.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: v175-unsigned-aligned-and-signing-tools
          path: |
            v175-unsigned-aligned/
            signing-tools/
            build/assemble-v175-release.log
          if-no-files-found: error
          retention-days: 7
