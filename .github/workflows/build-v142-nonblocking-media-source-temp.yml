name: Build v142 nonblocking media source

on:
  push:
    branches:
      - agent/v128-m4a-decrypt
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v128-m4a-decrypt
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Apply v142 patch when needed
        run: |
          if grep -q 'versionCode 2026080142' app/build.gradle; then
            echo 'v142 source already present'
          else
            python scripts/apply_v142_nonblocking_media_source_patch.py
          fi
      - name: Verify all feature requirements
        run: python scripts/check_feature_requirements.py
      - name: Assert first playable and nonblocking playback
        run: |
          python - <<'PY'
          from pathlib import Path
          main = Path('app/src/main/java/com/jianglab/babywife/MainActivity.java').read_text(encoding='utf-8')
          resolver = Path('app/src/main/java/com/jianglab/babywife/PlayableAudioResolver.java').read_text(encoding='utf-8')
          assert 'REQUEST_FORMATS = {""}' in resolver
          assert 'formatPriority' not in resolver
          assert 'break outer;' in resolver
          start = main.index('private void startLocalPlayback')
          end = main.index('private void onPlaybackStarted', start)
          block = main[start:end]
          assert '"media-source-open"' in block
          assert 'preparedPlayer.setDataSource(this, Uri.parse(playbackUri));' in block
          assert block.index('new Thread(() -> {') < block.index('preparedPlayer.setDataSource')
          assert 'mediaPlayer.setDataSource(this' not in block
          prepare_start = main.index('private void prepareLastSong')
          prepare_end = main.index('private void playSong', prepare_start)
          prepare_block = main[prepare_start:prepare_end]
          assert 'mediaPlayer.prepare();' not in prepare_block
          assert 'cachedAudioExists' not in prepare_block
          assert '!activityResumed || !windowFocused || !isDeviceInteractive()' in main
          assert 'protected void onPause()' in main
          assert 'onWindowFocusChanged(boolean hasFocus)' in main
          print('v142 nonblocking playback assertions passed')
          PY
      - name: Build four release APKs
        run: |
          gradle --no-daemon \
            :app:assembleBabywifeclassicRelease \
            :app:assembleJianglabRelease \
            :app:assembleLidacaizhuRelease \
            :app:assembleNiubiRelease
      - uses: actions/upload-artifact@v4
        with:
          name: v142-four-unsigned-release-apks
          path: app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error
      - name: Commit formal source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle \
            app/src/main/java/com/jianglab/babywife/MainActivity.java \
            scripts/check_feature_requirements.py PROJECT_LOG.md docs/CHANGELOG.md
          if git diff --cached --quiet; then
            echo 'No formal source changes to commit'
          else
            git commit -m 'Open media sources off main thread and gate watchdog [skip ci]'
            git fetch origin agent/v128-m4a-decrypt
            git rebase origin/agent/v128-m4a-decrypt
            git push origin HEAD:agent/v128-m4a-decrypt
          fi
