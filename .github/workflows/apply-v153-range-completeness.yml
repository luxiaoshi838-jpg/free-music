name: Apply v153 Range Completeness

on:
  push:
    branches:
      - agent/v128-m4a-decrypt

permissions:
  contents: write

jobs:
  apply-range-fix:
    if: ${{ !contains(github.event.head_commit.message, '[v153-range-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/v128-m4a-decrypt
          fetch-depth: 0

      - name: Replace incomplete Range termination rule
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/jianglab/babywife/SearchQuickPlayback.java')
          text = path.read_text(encoding='utf-8')

          anchor = '    private static final class RangeResponse {\n'
          content_range = '''    private static final class ContentRange {
              final long start;
              final long end;
              final long total;

              ContentRange(long start, long end, long total) {
                  this.start = start;
                  this.end = end;
                  this.total = total;
              }
          }

          '''
          content_range = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in content_range.splitlines()
          )
          if 'private static final class ContentRange' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('RangeResponse anchor not found exactly once')
              text = text.replace(anchor, content_range + anchor, 1)

          method_pattern = re.compile(
              r'    private static void downloadByRanges\(Candidate candidate, File output\) throws Exception \{.*?\n    \}\n\n    private static RangeResponse openRange',
              re.S)
          match = method_pattern.search(text)
          if not match:
              raise SystemExit('downloadByRanges method boundary not found')

          replacement = '''    private static void downloadByRanges(Candidate candidate, File output) throws Exception {
              long writtenTotal = 0L;
              long expectedTotal = -1L;
              boolean complete = false;
              int segment = 0;

              try (OutputStream stream = new BufferedOutputStream(new FileOutputStream(output, false))) {
                  while (!complete) {
                      throwIfInterrupted();
                      if (writtenTotal >= MAX_AUDIO_BYTES) {
                          throw new IllegalStateException("音频文件超过缓存大小限制");
                      }
                      long rangeEnd = Math.min(MAX_AUDIO_BYTES - 1L,
                          writtenTotal + RANGE_CHUNK_BYTES - 1L);
                      RangeResponse response = openRange(candidate, writtenTotal, rangeEnd);
                      long segmentBytes = 0L;
                      try {
                          ContentRange bounds = parseContentRange(response.contentRange);
                          if (response.statusCode == 416) {
                              long total = bounds == null ? -1L : bounds.total;
                              if (writtenTotal > 0L && total > 0L && writtenTotal == total) {
                                  expectedTotal = total;
                                  complete = true;
                                  continue;
                              }
                              throw new IllegalStateException(downloadDiagnostic(response, writtenTotal,
                                  "Range 超出范围但已写入长度与总长度不一致"));
                          }
                          if (response.statusCode != HttpURLConnection.HTTP_OK
                              && response.statusCode != HttpURLConnection.HTTP_PARTIAL) {
                              throw new IllegalStateException(downloadDiagnostic(response, writtenTotal,
                                  "HTTP 状态不可下载"));
                          }
                          if (response.statusCode == HttpURLConnection.HTTP_OK && writtenTotal > 0L) {
                              throw new IllegalStateException(downloadDiagnostic(response, writtenTotal,
                                  "后续分段被服务器改为完整响应"));
                          }
                          if (response.statusCode == HttpURLConnection.HTTP_PARTIAL) {
                              if (bounds == null) {
                                  throw new IllegalStateException(downloadDiagnostic(response, writtenTotal,
                                      "HTTP 206 缺少有效 Content-Range"));
                              }
                              if (bounds.start != writtenTotal) {
                                  throw new IllegalStateException(downloadDiagnostic(response, writtenTotal,
                                      "Range 起点不连续，期望 " + writtenTotal + "，实际 " + bounds.start));
                              }
                              if (bounds.end < bounds.start) {
                                  throw new IllegalStateException(downloadDiagnostic(response, writtenTotal,
                                      "Content-Range 结束位置小于起点"));
                              }
                              if (bounds.total > 0L) expectedTotal = bounds.total;
                          }
                          if (expectedTotal > MAX_AUDIO_BYTES) {
                              throw new IllegalStateException("音频文件超过缓存大小限制");
                          }

                          try (InputStream input = new BufferedInputStream(
                              response.connection.getInputStream())) {
                              byte[] buffer = new byte[64 * 1024];
                              int read;
                              while ((read = input.read(buffer)) >= 0) {
                                  throwIfInterrupted();
                                  if (read == 0) continue;
                                  segmentBytes += read;
                                  writtenTotal += read;
                                  if (writtenTotal > MAX_AUDIO_BYTES) {
                                      throw new IllegalStateException("音频文件超过缓存大小限制");
                                  }
                                  stream.write(buffer, 0, read);
                              }
                          }

                          if (segmentBytes <= 0L) {
                              throw new IllegalStateException(downloadDiagnostic(response, writtenTotal,
                                  "Range 响应正文为 0 字节"));
                          }
                          if (bounds != null && bounds.start >= 0L && bounds.end >= bounds.start) {
                              long declaredBytes = bounds.end - bounds.start + 1L;
                              if (segmentBytes != declaredBytes) {
                                  throw new IllegalStateException(downloadDiagnostic(response, writtenTotal,
                                      "Range 正文长度与 Content-Range 不一致，声明 "
                                          + declaredBytes + "，实际 " + segmentBytes));
                              }
                          }
                          segment++;
                          if (response.statusCode == HttpURLConnection.HTTP_OK) {
                              expectedTotal = response.contentLength > 0L
                                  ? response.contentLength : writtenTotal;
                              complete = true;
                          } else if (expectedTotal > 0L && writtenTotal >= expectedTotal) {
                              if (writtenTotal != expectedTotal) {
                                  throw new IllegalStateException(downloadDiagnostic(response, writtenTotal,
                                      "已写入长度超过 Content-Range 总长度"));
                              }
                              complete = true;
                          } else if (segment > 512) {
                              throw new IllegalStateException("Range 分段数量异常，已停止下载");
                          }
                      } finally {
                          response.connection.disconnect();
                      }
                  }
                  stream.flush();
              }

              if (!complete || writtenTotal <= 0L || !output.isFile()
                  || output.length() != writtenTotal) {
                  throw new IllegalStateException("Range 分段下载未生成完整音频文件");
              }
              if (expectedTotal > 0L && writtenTotal != expectedTotal) {
                  throw new IllegalStateException("Range 下载长度不完整：期望 "
                      + expectedTotal + " 字节，实际 " + writtenTotal + " 字节");
              }
          }

          private static RangeResponse openRange'''
          replacement = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in replacement.splitlines()
          )
          text = text[:match.start()] + replacement + text[match.end():]

          parser_pattern = re.compile(
              r'    private static long parseContentRangeTotal\(String value\) \{.*?\n    \}\n',
              re.S)
          parser_match = parser_pattern.search(text)
          if not parser_match:
              raise SystemExit('old Content-Range parser not found')
          parser = '''    private static ContentRange parseContentRange(String value) {
              if (value == null || value.trim().isEmpty()) return null;
              String text = value.trim();
              try {
                  if (text.startsWith("bytes */")) {
                      long total = Long.parseLong(text.substring("bytes */".length()).trim());
                      return new ContentRange(-1L, -1L, total);
                  }
                  if (!text.startsWith("bytes ")) return null;
                  String body = text.substring(6).trim();
                  int slash = body.lastIndexOf('/');
                  int dash = body.indexOf('-');
                  if (slash < 0 || dash < 0 || dash >= slash) return null;
                  long start = Long.parseLong(body.substring(0, dash).trim());
                  long end = Long.parseLong(body.substring(dash + 1, slash).trim());
                  String totalText = body.substring(slash + 1).trim();
                  long total = "*".equals(totalText) ? -1L : Long.parseLong(totalText);
                  return new ContentRange(start, end, total);
              } catch (Exception ignored) {
                  return null;
              }
          }
          '''
          parser = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in parser.splitlines()
          )
          text = text[:parser_match.start()] + parser + text[parser_match.end():]

          if 'segmentBytes < RANGE_CHUNK_BYTES' in text:
              raise SystemExit('short response completion rule remains')
          if 'parseContentRangeTotal' in text:
              raise SystemExit('old Content-Range parser remains')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify Range completeness source
        run: |
          grep -q 'private static final class ContentRange' app/src/main/java/com/jianglab/babywife/SearchQuickPlayback.java
          grep -q 'response.statusCode == 416' app/src/main/java/com/jianglab/babywife/SearchQuickPlayback.java
          grep -q 'Range 正文长度与 Content-Range 不一致' app/src/main/java/com/jianglab/babywife/SearchQuickPlayback.java
          grep -q 'Range 下载长度不完整' app/src/main/java/com/jianglab/babywife/SearchQuickPlayback.java
          ! grep -q 'segmentBytes < RANGE_CHUNK_BYTES' app/src/main/java/com/jianglab/babywife/SearchQuickPlayback.java
          git diff --check

      - name: Commit Range completeness fix
        run: |
          git config user.name 'luxiaoshi838-jpg'
          git config user.email 'luxiaoshi838@gmail.com'
          git add app/src/main/java/com/jianglab/babywife/SearchQuickPlayback.java
          git commit -m 'Require complete Range downloads [v153-range-applied] [skip ci]'
          git push origin HEAD:agent/v128-m4a-decrypt
