name: Export reverse engineering tools

on:
  push:
    branches:
      - tools/export-apksigner
  pull_request:
    branches:
      - main

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download tools
        run: |
          set -euo pipefail
          mkdir -p tools
          curl -L --fail -o tools/jadx-1.5.5.zip https://github.com/skylot/jadx/releases/download/v1.5.5/jadx-1.5.5.zip
          curl -L --fail -o tools/apktool_3.0.2.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.2/apktool_3.0.2.jar
      - uses: actions/upload-artifact@v4
        with:
          name: reverse-engineering-tools
          path: tools
