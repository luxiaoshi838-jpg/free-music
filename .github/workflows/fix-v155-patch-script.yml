name: Fix v155 Patch Matcher

on:
  push:
    branches:
      - agent/v128-m4a-decrypt

permissions:
  contents: write

jobs:
  fix-script:
    if: ${{ !contains(github.event.head_commit.message, '[v155-patch-matcher-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v128-m4a-decrypt
          fetch-depth: 0

      - name: Fix duplicate matcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_v155_cache_cover_fix.py')
          text = path.read_text(encoding='utf-8')
          old = '''text = replace_once(text,
              '                    String media3Key = Media3CacheStore.keyFor(\\n                        song.title, song.artist, song.catalogJson);',
              '                    String media3Key = Media3CacheStore.keyFor(\\n                        song.title, song.artist, song.catalogJson);\\n                    Media3PlaybackCacheIndex.record(this, media3Key, song.title,\\n                        song.artist, song.catalogJson, song.artworkUrl);',
              'record playback cache')'''
          new = '''text = replace_once(text,
              '                    String media3Key = Media3CacheStore.keyFor(\\n                        song.title, song.artist, song.catalogJson);\\n                    preparedPlayer.setDataSource(',
              '                    String media3Key = Media3CacheStore.keyFor(\\n                        song.title, song.artist, song.catalogJson);\\n                    Media3PlaybackCacheIndex.record(this, media3Key, song.title,\\n                        song.artist, song.catalogJson, song.artworkUrl);\\n                    preparedPlayer.setDataSource(',
              'record playback cache')'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one matcher block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Commit matcher fix
        run: |
          git config user.name 'luxiaoshi838-jpg'
          git config user.email 'luxiaoshi838@gmail.com'
          git add scripts/apply_v155_cache_cover_fix.py
          git commit -m 'Fix v155 patch matcher [v155-patch-matcher-fixed] [skip ci]'
          git push origin HEAD:agent/v128-m4a-decrypt
