name: Apply v153 Main Playback Report

on:
  push:
    branches:
      - agent/v128-m4a-decrypt

permissions:
  contents: write

jobs:
  apply-main-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/v128-m4a-decrypt
          fetch-depth: 0

      - name: Apply patch
        run: |
          if grep -q 'playback-stopped-without-callback' app/src/main/java/com/jianglab/babywife/MainActivity.java; then
            echo 'v153 MainActivity patch already applied.'
            exit 0
          fi
          python3 scripts/apply_v153_main_playback_report.py
          git diff --check

      - name: Verify source
        run: |
          grep -q 'PlaybackProblemReporter.store' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'PlaybackDurationGuard.clearlyShort' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'media-player-error' app/src/main/java/com/jianglab/babywife/MainActivity.java
          grep -q 'activity-destroyed-during-active-playback' app/src/main/java/com/jianglab/babywife/MainActivity.java

      - name: Commit source
        run: |
          if git diff --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'luxiaoshi838-jpg'
          git config user.email 'luxiaoshi838@gmail.com'
          git add app/src/main/java/com/jianglab/babywife/MainActivity.java
          git commit -m 'Record and recover playlist playback interruptions [v153-report-applied] [skip ci]'
          git push origin HEAD:agent/v128-m4a-decrypt
