name: Apply v126 source payload

on:
  push:
    branches:
      - agent/v126-cache-io-ui-feedback
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-payload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/v126-cache-io-ui-feedback
          fetch-depth: 0

      - name: Reassemble and verify payload
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .sync/v126_payload.part00 \
            .sync/v126_payload.part01 \
            .sync/v126_payload.part02 \
            .sync/v126_payload.tail00 \
            .sync/v126_payload.tail01 \
            .sync/v126_payload.tail02 \
            .sync/v126_payload.rem00 \
            .sync/v126_payload.rem01 \
            > /tmp/v126_payload.b64
          base64 --decode /tmp/v126_payload.b64 > /tmp/v126_payload.tar.gz
          echo "cfd52caf4a81b606207f9f495ea848b5fcc605fe2fe2fbaecfc2e93668531365  /tmp/v126_payload.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/v126_payload.tar.gz -C .

      - name: Validate merged source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_feature_requirements.py
          python3 - <<'PY'
          from pathlib import Path

          main = Path('app/src/main/java/com/jianglab/babywife/MainActivity.java').read_text(encoding='utf-8')
          gradle = Path('app/build.gradle').read_text(encoding='utf-8')

          required = [
              'refreshCachedUrisAfterMigrationAsync()',
              'new Thread(() -> {',
              '"cache-uri-refresh"',
              'attachSubtlePressFeedback(previous);',
              'attachSubtlePressFeedback(next);',
              'setScaleX(0.96f)',
              'clearSearchButton',
              'searchInput.setText("")',
              'versionCode 2026080126',
              'versionName "2026.08.02.cache-io-guard-ui-feedback"',
          ]
          combined = main + '\n' + gradle
          missing = [item for item in required if item not in combined]
          if missing:
              raise SystemExit('Missing v126 requirements: ' + ', '.join(missing))

          start = main.index('private void refreshCachedUrisAfterMigrationAsync()')
          end = main.index('\n    private ', start + 20)
          refresh = main[start:end]
          if 'CacheStorage.findAudioUri' not in refresh or 'new Thread' not in refresh:
              raise SystemExit('Cache URI refresh is not performed by the worker thread')
          print('v126 targeted assertions passed')
          PY

      - name: Commit merged v126 source
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .sync/v126_payload.part00 \
            .sync/v126_payload.part01 \
            .sync/v126_payload.part02 \
            .sync/v126_payload.tail00 \
            .sync/v126_payload.tail01 \
            .sync/v126_payload.tail02 \
            .sync/v126_payload.rem00 \
            .sync/v126_payload.rem01
          rmdir .sync 2>/dev/null || true
          rm -f .github/workflows/apply-v126-payload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync v126 cache I/O guards and UI feedback"
          git push origin HEAD:agent/v126-cache-io-ui-feedback
