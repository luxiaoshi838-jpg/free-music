name: Apply v126 source payload

on:
  push:
    branches:
      - agent/v126-cache-io-ui-feedback
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-payload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/v126-cache-io-ui-feedback
          fetch-depth: 0

      - name: Reassemble and verify payload
        shell: bash
        run: |
          set -euo pipefail
          cat <<'EOF' | sha256sum --check --strict
          1e814bd35a47405bbcb028524f338cf0a3ad7cb05a9b62f4c61a3894d80ebb34  .sync/v126_payload.p000
          787c5638c07a893123b6eaaf12ee3b1604257c00653b69b997d74a954b5b2dd2  .sync/v126_payload.p001
          1fde179be2cfe7a269540a916a25008710e78a9a309eaad7ae6ea88df8500538  .sync/v126_payload.p010
          f7b1afb63c98a82cb8f7750de14ff8f37c135deae53a229b364a1574a862351b  .sync/v126_payload.p011
          0117f08bfe1e456103eef762b17a9228d0837b138212b3f40232d566225d7604  .sync/v126_payload.part02
          1e035f4265b5a7dc702f8a2c69cf23a2ccbfae9e532c8311d61b00e00c149df5  .sync/v126_payload.tail00
          42ae85029fc693fc4edc12b3a72944c1e42a56b8a37b14371f3aae69a8a2cb46  .sync/v126_payload.tail01
          e576340f3490dc0b921f118045a80f7430adc059b04773716ceb2ffee639b01f  .sync/v126_payload.tail02
          e0836ea789e2ad2e7ee9cf48c3b0f1de33479524783a2632244186476f783e5c  .sync/v126_payload.rem00
          cc6556fec4878011395e5fad102ebce75859cf6222a218a080571179ad71946f  .sync/v126_payload.rem01
          EOF
          cat \
            .sync/v126_payload.p000 \
            .sync/v126_payload.p001 \
            .sync/v126_payload.p010 \
            .sync/v126_payload.p011 \
            .sync/v126_payload.part02 \
            .sync/v126_payload.tail00 \
            .sync/v126_payload.tail01 \
            .sync/v126_payload.tail02 \
            .sync/v126_payload.rem00 \
            .sync/v126_payload.rem01 \
            > /tmp/v126_payload.b64
          base64 --decode /tmp/v126_payload.b64 > /tmp/v126_payload.tar.gz
          echo "cfd52caf4a81b606207f9f495ea848b5fcc605fe2fe2fbaecfc2e93668531365  /tmp/v126_payload.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/v126_payload.tar.gz -C .

      - name: Validate merged source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_feature_requirements.py
          python3 - <<'PY'
          from pathlib import Path

          main = Path('app/src/main/java/com/jianglab/babywife/MainActivity.java').read_text(encoding='utf-8')
          gradle = Path('app/build.gradle').read_text(encoding='utf-8')
          combined = main + '\n' + gradle
          required = [
              'refreshCachedUrisAfterMigrationAsync()',
              '"cache-uri-refresh"',
              'attachSubtlePressFeedback(previous);',
              'attachSubtlePressFeedback(next);',
              '.scaleX(0.96f)',
              'clearSearchButton',
              'searchInput.setText("")',
              'versionCode 2026080126',
              'versionName "2026.08.02.cache-io-guard-ui-feedback"',
          ]
          missing = [item for item in required if item not in combined]
          if missing:
              raise SystemExit('Missing v126 requirements: ' + ', '.join(missing))

          start = main.index('private void refreshCachedUrisAfterMigrationAsync()')
          end = main.index('\n    private ', start + 20)
          refresh = main[start:end]
          if 'new Thread' not in refresh or 'CacheStorage.findAudioUri' not in refresh:
              raise SystemExit('Cache URI refresh is not fully delegated to the worker thread')
          print('v126 targeted assertions passed')
          PY

      - name: Commit merged v126 source
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .sync/v126_payload.part00 \
            .sync/v126_payload.part01 \
            .sync/v126_payload.p000 \
            .sync/v126_payload.p001 \
            .sync/v126_payload.p010 \
            .sync/v126_payload.p011 \
            .sync/v126_payload.part02 \
            .sync/v126_payload.tail00 \
            .sync/v126_payload.tail01 \
            .sync/v126_payload.tail02 \
            .sync/v126_payload.rem00 \
            .sync/v126_payload.rem01
          rmdir .sync 2>/dev/null || true
          rm -f .github/workflows/apply-v126-payload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync v126 cache I/O guards and UI feedback"
          git push origin HEAD:agent/v126-cache-io-ui-feedback
