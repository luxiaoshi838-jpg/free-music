name: Export Android Signing Tools

on:
  push:
    branches: [tools/export-build-tools-37]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - name: Install Build Tools 37
        run: sdkmanager 'build-tools;37.0.0'
      - name: Package signing tools
        run: |
          set -euo pipefail
          mkdir -p exported-build-tools
          cp -a "$ANDROID_HOME/build-tools/37.0.0/apksigner" exported-build-tools/
          cp -a "$ANDROID_HOME/build-tools/37.0.0/zipalign" exported-build-tools/
          cp -a "$ANDROID_HOME/build-tools/37.0.0/lib" exported-build-tools/
          cp -a "$ANDROID_HOME/build-tools/37.0.0/lib64" exported-build-tools/
          cp -a "$ANDROID_HOME/build-tools/37.0.0/package.xml" exported-build-tools/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-37-complete
          path: exported-build-tools/
          if-no-files-found: error
          retention-days: 1
