name: Build v139 complete search actions

on:
  push:
    branches:
      - agent/v128-m4a-decrypt
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v128-m4a-decrypt
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Apply v139 patch when needed
        run: |
          if grep -q 'versionCode 2026080139' app/build.gradle; then
            echo 'v139 source already present'
          else
            python scripts/apply_v139_complete_search_actions_patch.py
          fi
      - name: Verify feature requirements
        run: python scripts/check_feature_requirements.py
      - name: Assert complete search action state machine
        run: |
          python - <<'PY'
          from pathlib import Path
          main = Path('app/src/main/java/com/jianglab/babywife/MainActivity.java').read_text(encoding='utf-8')
          required = [
              'boolean unmatchedSearch = fromSearch && !existsInPlaylist;',
              'addCurrentButton.setVisibility(unmatchedSearch ? View.VISIBLE : View.GONE);',
              'songVersionButton.setVisibility(existsInPlaylist ? View.VISIBLE : View.GONE);',
              'lyricVersionButton.setVisibility(existsInPlaylist ? View.VISIBLE : View.GONE);',
              'Song target = findPlaylistSongMatch(selected);',
              'pendingSongTarget = target;',
              'pendingLyricSong = target;',
              'switchPlaybackToPlaylistSong(target);',
          ]
          missing = [item for item in required if item not in main]
          if missing:
              raise SystemExit('Missing complete search action logic: ' + ', '.join(missing))
          forbidden = [
              'addCurrentButton.setVisibility(fromSearch ? View.VISIBLE : View.GONE);',
              'boolean playlistContext = existsInPlaylist && !playingSearchQueue;',
          ]
          present = [item for item in forbidden if item in main]
          if present:
              raise SystemExit('Obsolete incomplete action logic remains: ' + ', '.join(present))
          print('Complete search action state machine verified')
          PY
      - name: Build four release APKs
        run: gradle --no-daemon :app:assembleBabywifeclassicRelease :app:assembleLidacaizhuRelease :app:assembleJianglabRelease :app:assembleNiubiRelease
      - uses: actions/upload-artifact@v4
        with:
          name: v139-four-unsigned-release-apks
          path: app/build/outputs/apk/*/release/*.apk
      - name: Commit formal source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add PROJECT_LOG.md app/build.gradle app/src/main/java/com/jianglab/babywife/MainActivity.java docs/CHANGELOG.md scripts/check_feature_requirements.py
          if ! git diff --cached --quiet; then
            git commit -m 'Complete search result action logic [skip ci]'
            git fetch origin agent/v128-m4a-decrypt
            git rebase origin/agent/v128-m4a-decrypt
            git push origin HEAD:agent/v128-m4a-decrypt
          fi
