name: Build v131 playable format priority

on:
  push:
    branches:
      - agent/v128-m4a-decrypt
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v128-m4a-decrypt
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Apply v131 patch
        run: python scripts/apply_v131_playable_formats_patch.py
      - name: Update legacy verification paths
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/check_feature_requirements.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "'AudioMetadataWriter.apply' in network": "'AudioMetadataWriter.apply' in playable_resolver",
              "'AudioTranscoder.ensureMp3' in network": "'AudioTranscoder.ensureMp3' in playable_resolver",
              "'按原格式缓存' in network": "'MP3＞FLAC＞M4A＞其他' in playable_resolver",
              "'detectAudioExtension' in network": "'detectAudioExtension' in playable_resolver",
              "'AudioMetadataWriter.applyAndVerify' in network": "'AudioMetadataWriter.applyAndVerify' in playable_resolver",
              "'storeAudio(context, key, actualExtension' in network": "'CacheStorage.storeAudio(context, key, best.extension' in playable_resolver",
              "'ResolvedAudioAddress.parse' in network": "'Address.parse' in playable_resolver",
              "'#auth=' in network": "'#auth=' in playable_resolver",
              "'SodaM4aDecryptor.decrypt' in network": "'SodaM4aDecryptor.decrypt' in playable_resolver",
              "'SodaM4aDecryptor.isEncryptedM4a(context, uriText)' in network": "'SodaM4aDecryptor.isEncryptedM4a(context, uriText)' in playable_resolver",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'legacy verification token missing: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify requirements
        run: python scripts/check_feature_requirements.py
      - name: Build four release APKs
        run: gradle --no-daemon :app:assembleBabywifeclassicRelease :app:assembleLidacaizhuRelease :app:assembleJianglabRelease :app:assembleNiubiRelease
      - uses: actions/upload-artifact@v4
        with:
          name: v131-four-unsigned-release-apks
          path: app/build/outputs/apk/*/release/*.apk
      - name: Commit formal source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add PROJECT_LOG.md app/build.gradle app/src/main/java/com/jianglab/babywife/AudioPlaybackVerifier.java app/src/main/java/com/jianglab/babywife/PlayableAudioResolver.java app/src/main/java/com/jianglab/babywife/NetworkMediaCache.java app/src/main/java/com/jianglab/babywife/CacheStorage.java docs/CHANGELOG.md scripts/check_feature_requirements.py
          if ! git diff --cached --quiet; then
            git commit -m 'Accept only device-playable formats by priority [skip ci]'
            git fetch origin agent/v128-m4a-decrypt
            git rebase origin/agent/v128-m4a-decrypt
            git push origin HEAD:agent/v128-m4a-decrypt
          fi
